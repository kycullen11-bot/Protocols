<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Master Protocol">
<meta name="theme-color" content="#0a0e14">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Kyle Health &amp; Recovery Master Protocol</title>
<style>
:root{
  --bg:#0a0e14;--bgk:#0a0e14;--card:#141a24;--card2:#182030;--card3:#1d2635;--border:#232c3a;--line2:#3a4658;
  --text:#eef2f7;--dim:#9aa5b6;--dim2:#8b96a9;--blue:#4b8df8;--acc:#f0a838;--red:#ef5b5b;--green:#3fbf7f;--amber:#e0a531;
  --fig:#dfe7f2;--fig2:#7d8aa0;--prop:#2a3444;--panel:#1c2533;
  --tint-g:rgba(63,191,127,.13);--tint-a:rgba(224,165,49,.13);--tint-r:rgba(239,91,91,.13);--tint-b:rgba(75,141,248,.13);
  --fs:16px;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f4f7;--bgk:#ffffff;--card:#ffffff;--card2:#f1f3f7;--card3:#e8ebf1;--border:#dde2ea;--line2:#b8c0cc;
  --text:#141a24;--dim:#556072;--dim2:#5f6a7c;--blue:#2563eb;--acc:#975a00;--red:#b52f2f;--green:#18774a;--amber:#8a5a00;
  --fig:#2a3342;--fig2:#9aa6b8;--prop:#d5dbe4;--panel:#e7ebf1;
  --tint-g:rgba(31,138,85,.1);--tint-a:rgba(168,111,0,.1);--tint-r:rgba(201,54,54,.1);--tint-b:rgba(37,99,235,.08);
  color-scheme:light;
}
:root[data-text="large"]{--fs:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:var(--fs);line-height:1.45;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:calc(76px + var(--safe-b))}
a{color:var(--blue)}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;font-size:16px;color:var(--text)}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
.hidden{display:none!important}
.muted{color:var(--dim)}.small{font-size:.84em}.tiny{font-size:.78em}
b,strong{font-weight:650}

/* top bar */
.topbar{position:sticky;top:0;z-index:40;background:var(--bg);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);padding:calc(8px + var(--safe-t)) 0 8px}
.topbar .wrap{display:flex;align-items:center;gap:10px}
.tb-title{flex:1;min-width:0}
.tb-title h1{font-size:1.02em;margin:0;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title .sub{font-size:.76em;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:var(--card2);display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn svg{width:20px;height:20px;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.76em;font-weight:700;padding:3px 8px;border-radius:999px;border:1px solid var(--border);background:var(--card2);color:var(--dim);white-space:nowrap}
.chip.g{background:var(--tint-g);color:var(--green);border-color:transparent}
.chip.a{background:var(--tint-a);color:var(--amber);border-color:transparent}
.chip.r{background:var(--tint-r);color:var(--red);border-color:transparent}
.chip.b{background:var(--tint-b);color:var(--blue);border-color:transparent}
.chip.warn{background:var(--tint-a);color:var(--acc);border-color:transparent}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.g{background:var(--green)}.dot.a{background:var(--amber)}.dot.r{background:var(--red)}.dot.n{background:var(--dim2)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--border);padding:4px 4px calc(4px + var(--safe-b))}
.nav .in{max-width:680px;margin:0 auto;display:flex}
.nav button{flex:1;min-width:0;background:none;border:0;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--dim2);font-size:10.5px;font-weight:600;min-height:52px}
.nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="true"]{color:var(--blue)}

.page{display:none;padding:12px 0 24px}
.page.on{display:block}
h2.sec{font-size:.78em;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:22px 2px 8px;font-weight:700}
h2.sec:first-child{margin-top:4px}
h3{font-size:1em;margin:0 0 6px}

/* setup block */
.setup{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px}
.lbl{font-size:.7em;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;margin:2px 2px 6px}
.seg{display:flex;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-width:0;border:0;background:transparent;color:var(--dim);font-size:.8em;font-weight:650;padding:9px 2px;border-radius:9px;min-height:44px;line-height:1.1}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.seg.rag button[data-v="green"][aria-pressed="true"]{background:var(--green);color:#04170c}
.seg.rag button[data-v="amber"][aria-pressed="true"]{background:var(--amber);color:#261800}
.seg.rag button[data-v="red"][aria-pressed="true"]{background:var(--red);color:#2a0000}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--border);background:var(--card2);color:var(--dim);border-radius:999px;padding:7px 12px;font-size:.8em;font-weight:600;min-height:44px}
.chips button[aria-pressed="true"]{background:var(--tint-b);color:var(--blue);border-color:var(--blue)}
.row2{display:flex;gap:10px}.row2>*{flex:1;min-width:0}
.banner{border-radius:12px;padding:10px 12px;font-size:.86em;margin-top:10px;line-height:1.4}
.banner.green{background:var(--tint-g);color:var(--green)}
.banner.amber{background:var(--tint-a);color:var(--amber)}
.banner.red{background:var(--tint-r);color:var(--red)}
.banner.info{background:var(--card2);color:var(--dim)}
.banner b{color:inherit}
.note{background:var(--tint-a);border-radius:12px;padding:10px 12px;font-size:.84em;color:var(--text);line-height:1.45;margin:10px 0}
.note b{color:var(--acc)}
.note.blue{background:var(--tint-b)}.note.blue b{color:var(--blue)}
.note.red{background:var(--tint-r)}.note.red b{color:var(--red)}
.note.plain{background:var(--card2)}

/* progress */
.progress{display:flex;align-items:center;gap:12px;margin:14px 2px 6px}
.progress .n{font-size:.84em;color:var(--dim);font-weight:650;white-space:nowrap}
.progress .bar{flex:1;height:8px;background:var(--card2);border-radius:5px;overflow:hidden;border:1px solid var(--border)}
.progress .bar i{display:block;height:100%;background:var(--green);border-radius:5px;transition:width .3s}

/* cards / accordions */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;margin:10px 0;overflow:hidden}
.card>.hd{display:flex;align-items:center;gap:10px;padding:14px 14px;min-height:56px;cursor:pointer;width:100%;background:none;border:0;text-align:left}
.card>.hd .t{flex:1;min-width:0;font-weight:750;font-size:.9em;letter-spacing:.03em;text-transform:uppercase}
.card>.hd .c{font-size:.78em;color:var(--dim);font-weight:650}
.card>.hd .c.done{color:var(--green)}
.chev{width:18px;height:18px;stroke:var(--dim2);fill:none;stroke-width:2.2;transition:transform .2s;flex:none}
.card.open>.hd .chev{transform:rotate(180deg)}
.card>.bd{display:none;padding:0 12px 12px;border-top:1px solid var(--border)}
.card.open>.bd{display:block}
.ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--card2);flex:none;font-size:15px}

.item{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid var(--border)}
.item:last-child{border-bottom:0}
.check{width:32px;height:32px;border-radius:50%;border:2px solid var(--line2);flex:none;background:transparent;position:relative;margin-top:0;padding:0}
.check::before{content:"";position:absolute;inset:-7px;border-radius:50%}
.check[aria-checked="true"]{background:var(--green);border-color:var(--green)}
.check[aria-checked="true"]::after{content:"";position:absolute;left:10px;top:5px;width:7px;height:13px;border:solid #04170c;border-width:0 3px 3px 0;transform:rotate(45deg)}
.check.opt{border-style:dashed}
.check.na{visibility:hidden}
.item .body{flex:1;min-width:0}
.item .tt{font-weight:650;font-size:.95em;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.item .ds{font-size:.84em;color:var(--dim);margin-top:2px}
.item .cue{font-size:.8em;color:var(--dim);margin-top:5px;padding-left:8px;border-left:2px solid var(--line2);line-height:1.4}
.item .ds.amber{color:var(--amber)}.item .ds.red{color:var(--red)}
.item.done .tt{color:var(--dim)}
.item .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:.7em;font-weight:800;padding:2px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.04em}
.tag.prov{background:var(--tint-a);color:var(--acc)}
.tag.gentle{background:var(--tint-g);color:var(--green)}
.tag.conf{background:var(--tint-r);color:var(--red)}
.tag.src{background:var(--card2);color:var(--dim);text-transform:none;letter-spacing:0;font-weight:650}
.more{display:none;font-size:.86em;color:var(--dim);margin-top:8px;line-height:1.5}
.more.on{display:block}
.more p{margin:0 0 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;padding:12px 16px;min-height:46px;font-size:.92em}
.btn.sm{padding:8px 12px;min-height:44px;font-size:.82em;border-radius:10px}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--border)}
.btn.acc{background:var(--acc);color:#1d1200}
.btn.red{background:var(--red);color:#fff}
.btn.block{display:flex;width:100%;margin-top:8px}
.btn[disabled]{opacity:.45}
.linkbtn{background:none;border:0;color:var(--blue);font-weight:650;padding:6px 0;font-size:.86em}

/* rows & lists */
.rows .r{display:flex;gap:12px;padding:10px 2px;border-bottom:1px solid var(--border);font-size:.88em;line-height:1.45}
.rows .r:last-child{border-bottom:0}
.rows .r .k{flex:0 0 96px;color:var(--dim);font-weight:650;font-size:.92em}
.rows .r .v{flex:1;min-width:0}
.rows.tight .r{padding:7px 2px}
.ex{padding:10px 2px;border-bottom:1px solid var(--border)}
.ex:last-child{border-bottom:0}
.ex .n{display:flex;justify-content:space-between;gap:10px;font-weight:650;font-size:.92em}
.ex .n span{color:var(--acc);white-space:nowrap}
.ex .m{font-size:.82em;color:var(--dim);margin-top:2px}
.ex.cut{opacity:.45}
details.acc{background:var(--card);border:1px solid var(--border);border-radius:14px;margin:8px 0;overflow:hidden}
details.acc>summary{list-style:none;cursor:pointer;padding:14px;display:flex;align-items:center;gap:10px;font-weight:650;min-height:52px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary .s{flex:1;min-width:0}
details.acc>summary .m{font-size:.76em;color:var(--dim);font-weight:600}
details.acc[open]>summary .chev{transform:rotate(180deg)}
details.acc>.in{padding:0 14px 14px;border-top:1px solid var(--border)}
.pill{display:inline-block;font-size:.74em;font-weight:750;padding:2px 8px;border-radius:999px}
.pill.g{background:var(--tint-g);color:var(--green)}.pill.a{background:var(--tint-a);color:var(--amber)}.pill.r{background:var(--tint-r);color:var(--red)}.pill.n{background:var(--card2);color:var(--dim)}
.flag{border-left:3px solid var(--red);padding:8px 0 8px 12px;margin:8px 0;font-size:.86em}
.flag b{color:var(--red);display:block;font-size:.8em;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.trig{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--border)}
.trig:last-child{border-bottom:0}
.trig .sc{flex:none;width:44px;text-align:center;font-weight:800;color:var(--acc)}
.trig .bar{height:6px;background:var(--card2);border-radius:4px;margin-top:6px;overflow:hidden}
.trig .bar i{display:block;height:100%;background:var(--acc);border-radius:4px}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;text-align:left;min-height:84px;display:flex;flex-direction:column;gap:4px}
.tile .t{font-weight:750;font-size:.92em}
.tile .d{font-size:.76em;color:var(--dim)}
.tile .e{font-size:20px}

/* forms */
.field{margin:12px 0}
.field>label,.field>.fl{display:block;font-size:.76em;color:var(--dim);font-weight:700;margin:0 2px 6px;text-transform:uppercase;letter-spacing:.04em}
.inp{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px;min-height:46px;color:var(--text)}
textarea.inp{min-height:70px;resize:vertical}
.scale{display:grid;gap:4px}
.scale button{border:1px solid var(--border);background:var(--card2);border-radius:9px;min-height:44px;font-weight:700;font-size:.88em;color:var(--dim);padding:0}
.scale button[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
.saved{font-size:.78em;color:var(--green);font-weight:700;min-height:1.2em}
.hist{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:.84em}
.hist .h{display:flex;justify-content:space-between;align-items:center;font-weight:700;gap:8px}
.hist .b{color:var(--dim);margin-top:4px;line-height:1.5}

/* review charts */
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px}
.stat .k{font-size:.74em;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.stat .v{font-size:1.5em;font-weight:750;letter-spacing:-.02em;margin-top:2px}
.stat .v small{font-size:.5em;color:var(--dim);font-weight:600;margin-left:3px}
.stat svg{display:block;width:100%;height:42px;margin-top:6px}
.stat svg .b{fill:var(--blue)}
.stat svg .m{fill:var(--line2)}
.stat .tip{font-size:.72em;color:var(--dim);min-height:1.1em}
.rag-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--card2)}
.rag-bar i{display:block;height:100%}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--bg);border-radius:20px 20px 0 0;border-top:1px solid var(--border);
  max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s}
.sheet.on{transform:none;visibility:visible;transition:transform .25s ease,visibility 0s}
.sheet .sh-hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border)}
.sheet .sh-hd h3{flex:1;margin:0;font-size:1.02em}
.sheet .sh-bd{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px calc(20px + var(--safe-b))}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:8px auto 0}
.demo-stage{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:6px;margin-top:4px}
.demo-label{font-size:.86em;color:var(--acc);font-weight:650;min-height:2.6em;padding:8px 2px 4px}
.demo-ctl{display:flex;gap:8px;flex-wrap:wrap}
.demo-miss{padding:20px;color:var(--dim);text-align:center}
.exsec{margin-top:14px}
.exsec h4{margin:0 0 4px;font-size:.74em;text-transform:uppercase;letter-spacing:.05em;color:var(--dim)}
.exsec ul{margin:0;padding-left:20px;font-size:.9em;line-height:1.5}
.exsec p{margin:0;font-size:.9em;line-height:1.5}
.vid{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:12px;background:var(--card);margin-top:8px;text-decoration:none;color:var(--text)}
.vid .p{width:30px;height:30px;border-radius:50%;background:var(--tint-b);display:flex;align-items:center;justify-content:center;flex:none;color:var(--blue);font-size:12px}
.vid .d{flex:1;min-width:0;font-size:.84em}
.vid .d span{display:block;color:var(--dim);font-size:.88em}

/* breath player */
.bp{position:fixed;inset:0;z-index:120;background:var(--bgk);display:none;flex-direction:column;padding:calc(10px + var(--safe-t)) 16px calc(12px + var(--safe-b));overflow-y:auto}
.bp.on{display:flex}
.bp.dark{background:#000}
.bp-top{display:flex;align-items:center;gap:10px}
.bp-top h3{flex:1;margin:0;font-size:1em}
.bp-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;position:relative}
.bp-ring{width:min(78vw,340px);height:min(78vw,340px);position:relative;display:flex;align-items:center;justify-content:center}
.bp-circle{position:absolute;inset:0;border-radius:50%;background:rgba(75,141,248,.45);background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--blue) 55%,transparent),color-mix(in srgb,var(--blue) 18%,transparent) 70%);
  box-shadow:0 0 60px color-mix(in srgb,var(--blue) 35%,transparent);transform:scale(.55);will-change:transform}
.bp-guide{position:absolute;inset:0;border-radius:50%;border:2px dashed color-mix(in srgb,var(--dim) 45%,transparent)}
.bp-text{position:relative;text-align:center;z-index:2}
.bp-phase{font-size:1.7em;font-weight:800;letter-spacing:.06em}
.bp-sec{font-size:3em;font-weight:250;font-variant-numeric:tabular-nums;line-height:1.1}
.bp-sub{font-size:.8em;color:var(--dim)}
.bp-meta{display:flex;justify-content:space-between;font-size:.84em;color:var(--dim);margin:10px 2px;font-variant-numeric:tabular-nums}
.bp-ctl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.bp-ctl .btn{min-height:54px}
.bp-opts{margin-top:10px}
.range{width:100%;accent-color:var(--blue);height:32px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px solid var(--border);font-size:.9em}
.switch:last-child{border-bottom:0}
.tog{width:52px;height:32px;border-radius:16px;background:var(--line2);border:0;position:relative;flex:none;transition:background .2s;padding:0}
.tog::after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s}
.tog[aria-checked="true"]{background:var(--green)}
.tog[aria-checked="true"]::after{left:23px}
.band{position:relative;height:20px;background:var(--card2);border-radius:6px;overflow:hidden;margin-top:6px}
.band .seg{position:absolute;top:0;bottom:0;border-radius:0}
.band .sleep{background:#3b4f7a}.band .nap{background:#5b73a8}.band .shift{background:#7a5a2b}.band .lamp{background:#b9962f}.band .train{background:#2f7a55}
.band .now{position:absolute;top:0;bottom:0;width:2px;background:var(--red)}
.axis{position:relative;height:14px;font-size:10px;color:var(--dim)}
.axis span{position:absolute;transform:translateX(-50%)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.76em;color:var(--dim);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.srch{position:relative}

.sres .t{font-weight:650;font-size:.92em}
.sres .x{font-size:.8em;color:var(--dim)}
mark{background:var(--tint-a);color:var(--acc);border-radius:3px;padding:0 1px}
.weeknav{display:flex;align-items:center;gap:10px;margin:6px 0 10px}

.regitem .rows .r .k{flex-basis:84px}
.st{font-size:.68em;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:999px;white-space:nowrap}
.st.active{background:var(--tint-g);color:var(--green)}
.st.unconfirmed,.st.pending,.st.considering{background:var(--tint-a);color:var(--amber)}
.st.paused,.st.conditional{background:var(--tint-b);color:var(--blue)}
.st.discontinued,.st.evaluated{background:var(--card2);color:var(--dim)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}

.days button[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--card3);color:var(--text);border:1px solid var(--border);
  padding:10px 16px;border-radius:12px;font-size:.86em;font-weight:650;z-index:200;opacity:0;transition:all .25s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){.sheet,.card .chev,.progress .bar i{transition:none}}
:root[data-theme="light"] .btn.acc{color:#fff}
/* ---- adaptive plan ---- */
.adapt{background:var(--card);border:1px solid var(--blue);border-radius:16px;padding:12px 12px 6px;margin:12px 0}
.adapt .ah{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.adapt .ah .t{font-weight:800;font-size:.9em;letter-spacing:.04em;text-transform:uppercase}
.pill.b{background:var(--tint-b);color:var(--blue)}
.sleeprow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sleeprow .l{font-weight:700;font-size:.9em;flex:0 0 auto}
.hm{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hm .inp{width:64px;text-align:center;font-size:18px;font-weight:700;padding:8px 6px;min-height:44px}

.hm .linkbtn{margin-left:4px}
ul.arrow{list-style:none;margin:4px 0 10px;padding:0}
ul.arrow li{position:relative;padding:5px 0 5px 22px;font-size:.9em;line-height:1.4;border-bottom:1px solid var(--border)}
ul.arrow li:last-child{border-bottom:0}
ul.arrow li:before{content:"→";position:absolute;left:2px;top:5px;color:var(--blue);font-weight:800}
.adapt .why{font-size:.84em;color:var(--dim);line-height:1.45;margin-bottom:8px}
.adapt .why p{margin:0 0 6px}
details.acc.mini{margin:6px 0 8px;border-radius:12px}
details.acc.mini>summary{min-height:44px;padding:10px 12px;font-size:.86em}
details.acc.mini>.in{padding:0 12px 10px}
/* ---- tendencies ---- */
.tend{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;margin:10px 0}
.tend.p{border-color:var(--blue)}
.tend .q{font-weight:700;font-size:.9em;margin-bottom:8px}
.tend .rw{display:flex;align-items:baseline;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:.86em}
.tend .rw:last-child{border-bottom:0}
.tend .rw span{flex:1;min-width:0}
.tend .rw b{font-variant-numeric:tabular-nums}
.tend .rw i{font-style:normal;color:var(--dim);font-size:.86em;min-width:48px;text-align:right}
.tend .rw.low b,.tend .rw.low span{color:var(--dim)}
.tend .vd{font-size:.82em;color:var(--dim);margin-top:8px;line-height:1.45}
.tend.p .vd{color:var(--text)}
/* ---- Today's plan / Next up ---- */
.plan{background:var(--card);border:1px solid var(--blue);border-radius:16px;padding:12px;margin:8px 0 10px}
.plan .ph{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.plan .ph .t{font-weight:800;font-size:.9em;letter-spacing:.04em;text-transform:uppercase}
.plan .ph .dt{font-size:.78em;color:var(--dim);font-weight:650}
.notfinal{background:var(--tint-a);border-radius:12px;padding:10px 12px;margin:4px 0 8px}
.notfinal b{display:block;color:var(--amber);letter-spacing:.03em}
.notfinal span{font-size:.8em;color:var(--dim)}
.btn.big{display:block;width:100%;min-height:54px;font-size:1.05em;font-weight:800;letter-spacing:.05em;margin:0 0 10px}
.pgrid{display:grid;grid-template-columns:auto 1fr;column-gap:12px;row-gap:0;font-size:.88em;line-height:1.4}
.pgrid .k{color:var(--dim);font-weight:650;font-size:.92em;padding:7px 0;border-bottom:1px solid var(--border);white-space:nowrap}
.pgrid .v{padding:7px 0;border-bottom:1px solid var(--border);min-width:0}
.pgrid .k:nth-last-child(2),.pgrid .v:last-child{border-bottom:0}
.pgrid .why1{font-size:.86em;color:var(--dim);margin-top:2px}
.pgrid .warn{color:var(--amber);font-weight:700}
.pacts{display:flex;gap:8px;margin:10px 0 4px;flex-wrap:wrap}.pacts .btn{flex:1;min-width:0}
.nextup{background:var(--card2);border:1px solid var(--border);border-radius:16px;padding:10px 12px;margin:0 0 10px}
.nextup .nl{font-size:.7em;font-weight:800;letter-spacing:.08em;color:var(--acc);margin-bottom:4px}
.nextup .nx{display:block;width:100%;text-align:left;background:none;border:0;padding:4px 0;color:var(--text);min-height:44px;cursor:pointer}
.nextup .nx b{display:block;font-size:1.02em}
.nextup .nx span{font-size:.8em;color:var(--dim)}
.nextup .then{font-size:.78em;color:var(--dim);border-top:1px solid var(--border);padding-top:6px;margin-top:4px}
.hm .stp{width:44px;min-height:44px;border-radius:12px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:1.3em;font-weight:700}
/* ---- Log ---- */
.logtabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 10px}
.logtabs button{border:1px solid var(--border);background:var(--card);border-radius:14px;padding:12px 10px;min-height:68px;text-align:left;color:var(--text);display:flex;flex-direction:column;gap:4px}
.logtabs button b{font-size:.78em;letter-spacing:.05em}
.logtabs button span{font-size:.8em;font-weight:700}
.logtabs button span.ok{color:var(--green)}.logtabs button span.todo{color:var(--amber)}
.logtabs button[aria-pressed="true"]{border-color:var(--blue);background:var(--tint-b)}
.lh{font-size:.8em;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);margin:14px 2px 2px}
/* ---- Trends answers ---- */
.answer{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 12px;margin:0 0 10px}
.answer .at{font-weight:800;font-size:.8em;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.answer.help .at{color:var(--green)}.answer.hurt .at{color:var(--red)}.answer.chg .at{color:var(--blue)}
.answer ul{margin:0;padding-left:18px;font-size:.86em;line-height:1.45}.answer li{margin:4px 0}
/* ---- More ---- */
.morelist{display:flex;flex-direction:column;gap:8px}
.moreitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;min-height:60px;color:var(--text)}
.moreitem .e{font-size:1.2em;width:28px;text-align:center}
.moreitem .b{flex:1;min-width:0;display:flex;flex-direction:column}
.moreitem .t{font-weight:700}.moreitem .d{font-size:.8em;color:var(--dim)}
.moreitem .c{color:var(--dim);font-size:1.3em}

/* ---------- schedule calendar ---------- */
.schjump{display:flex;align-items:center;gap:8px;margin:8px 0 2px}
.schjump label{font-size:.72em;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.schjump .inp{flex:1;min-width:0;min-height:40px;padding:8px 10px;color-scheme:inherit}
.schjump .btn{flex:0 0 auto}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal-dow span{text-align:center;font-size:.64em;font-weight:800;color:var(--dim2);letter-spacing:.04em;text-transform:uppercase}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:4px}
.cal button{position:relative;min-width:0;aspect-ratio:.8;border:1px solid var(--border);background:var(--card);border-radius:9px;padding:2px 1px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--dim);overflow:hidden}
.cal button.blank{visibility:hidden}
.cal button .dn{font-size:.84em;font-weight:750;color:var(--text);line-height:1.15}
.cal button .ty{font-size:.54em;font-weight:800;line-height:1.1;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:clip}
.cal button .tr{font-size:.6em;font-weight:800;line-height:1.1;color:var(--green)}
.cal button.D{background:var(--tint-a);border-color:transparent}
.cal button.N{background:var(--tint-b);border-color:transparent}
.cal button.lift{box-shadow:inset 0 3px 0 var(--green)}
.cal button.edited::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--acc)}
.cal button.past .dn,.cal button.past .ty{opacity:.55}
.cal button.today{outline:2px solid var(--text);outline-offset:-2px}
.cal button.sel{outline:2px solid var(--blue);outline-offset:-2px}
.cal-key{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:.72em;color:var(--dim)}
.cal-key span{display:inline-flex;align-items:center;gap:5px}
.cal-key i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--border);background:var(--card)}
.cal-key i.k-d{background:var(--tint-a);border-color:transparent}.cal-key i.k-n{background:var(--tint-b);border-color:transparent}
.cal-key i.k-l{box-shadow:inset 0 3px 0 var(--green)}.cal-key i.k-e{box-shadow:inset 0 -3px 0 var(--acc)}
.schopts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.schopts button{border:1px solid var(--border);background:var(--card2);color:var(--text);border-radius:12px;padding:9px 10px;text-align:left;font-weight:650;font-size:.84em;min-height:50px;line-height:1.2}
.schopts button small{display:block;color:var(--dim);font-weight:500;font-size:.8em;margin-top:2px}
.schopts button[aria-pressed="true"]{background:var(--tint-b);border-color:var(--blue);color:var(--blue)}

/* ---------- r7: check-ins, readiness, trends, AI ---------- */
.hint{font-size:.76em;color:var(--dim);margin:-2px 2px 8px;line-height:1.4}
.sublbl{display:block;font-size:.72em;color:var(--dim2);font-weight:700;margin:0 2px 4px}
.sltimes input[type=time]{width:100%}
.slcalc{color:var(--dim);margin:8px 2px 0}.slcalc b{color:var(--text)}.slcalc .warn,.pgrid .warn{color:var(--amber)}
.dose{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.dose .chips{flex:0 0 auto}.dose input{flex:1;min-width:120px}
.rdybox{border-radius:14px;padding:12px;margin:14px 0 6px;border:1px solid var(--border);background:var(--card2)}
.rdybox.green{background:var(--tint-g);border-color:color-mix(in srgb,var(--green) 45%,transparent)}
.rdybox.amber{background:var(--tint-a);border-color:color-mix(in srgb,var(--amber) 45%,transparent)}
.rdybox.red{background:var(--tint-r);border-color:color-mix(in srgb,var(--red) 45%,transparent)}
.rdybox .rt{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rdybox .rt .lb{font-size:.72em;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.rdybox .rt b{font-size:1.15em;font-weight:850;letter-spacing:.03em}
.rdybox.green .rt b{color:var(--green)}.rdybox.amber .rt b{color:var(--amber)}.rdybox.red .rt b{color:var(--red)}.rdybox.none .rt b{color:var(--dim)}
.rdybox .rt .src{margin-left:auto;font-size:.7em;color:var(--dim);font-weight:700}
.rdybox p{margin:6px 0 0;font-size:.86em;line-height:1.45}
.rdybox .ra{margin-top:8px}
ul.rr{margin:6px 0 0;padding-left:18px;font-size:.84em;line-height:1.45}ul.rr li{margin:2px 0}
.rdy{border-radius:12px;padding:10px 12px;margin:0 0 10px;background:var(--card2);border:1px solid var(--border)}
.rdy.green{background:var(--tint-g)}.rdy.amber{background:var(--tint-a)}.rdy.red{background:var(--tint-r)}
.rdy .rh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.rdy .rh b{font-size:.92em}
.rdy .rh .pill{font-size:.72em;padding:3px 9px}
.rdy .rh .src{margin-left:auto;font-size:.7em;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.rdy .rs{font-size:.84em;margin-top:6px;line-height:1.45}
.radj{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:.78em;color:var(--dim)}
.radj .lb{flex-basis:100%;font-weight:800;letter-spacing:.05em;text-transform:uppercase;font-size:.9em}
.radj b{color:var(--text);font-weight:700}
.rdy .linkbtn{margin-top:4px;padding-left:0}
.chg{background:var(--card2);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:.82em;display:flex;flex-direction:column;gap:3px}
.chg .lb{font-weight:800;font-size:.86em;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.chg .up{color:var(--green)}.chg .dn{color:var(--red)}.chg .eq{color:var(--dim)}

.answer.sig .at{color:var(--acc)}
.cov{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 12px;margin:0 0 10px}
.cov .ct{font-weight:800;font-size:.8em;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px}.cov .ct span{color:var(--dim);font-weight:650;text-transform:none;letter-spacing:0;margin-left:4px}
.cov .cg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cov .cg div{display:flex;flex-direction:column;background:var(--card2);border-radius:10px;padding:7px 8px;min-width:0}
.cov .cg b{font-size:1.15em;font-variant-numeric:tabular-nums}.cov .cg b small{font-size:.6em;color:var(--dim);font-weight:600;display:block}
.cov .cg span{font-size:.68em;color:var(--dim);font-weight:650;line-height:1.25}
details.reltb>summary .ev{margin-left:auto;margin-right:6px}
.ev{display:inline-block;font-size:.7em;font-weight:800;letter-spacing:.03em;padding:2px 7px;border-radius:999px;background:var(--card3);color:var(--dim);white-space:nowrap}
.ev.consistent{background:var(--tint-b);color:var(--blue)}.ev.possible{background:var(--tint-a);color:var(--amber)}.ev.none{background:var(--card3);color:var(--dim)}.ev.few{background:transparent;color:var(--dim);border:1px dashed var(--line2)}
table.rt{width:100%;border-collapse:collapse;font-size:.8em;table-layout:fixed}
table.rt th{text-align:left;color:var(--dim);font-weight:700;font-size:.86em;padding:4px 4px 6px;border-bottom:1px solid var(--border)}
table.rt td{padding:7px 4px;border-bottom:1px solid var(--border);vertical-align:top;font-variant-numeric:tabular-nums;font-weight:650}
table.rt td:first-child{font-weight:600;color:var(--text)}table.rt th:first-child{width:40%}
table.rt td i{display:block;font-style:normal;color:var(--dim2);font-size:.82em;font-weight:600}
table.rt td .ev{margin-top:3px;font-size:.74em}
table.rt tr.few td:not(:first-child),table.rt tr.none td:not(:first-child){color:var(--dim)}
table.rt td.up{color:var(--green)}table.rt td.dn{color:var(--red)}
table.rt.five th:first-child{width:28%}table.rt.five{font-size:.74em}
.rtwrap{overflow-x:auto}
details.reltb .vd{font-size:.8em;color:var(--dim);margin-top:8px;line-height:1.45}
.tend.e{border-color:var(--amber)}

/* Ask AI */
.aibar{display:flex;align-items:center;gap:8px;margin:2px 0 10px}.aibar b{flex:1;text-align:center}
.aititle{flex:1;min-width:0;background:none;border:0;color:var(--text);font-weight:750;font-size:.92em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:6px 4px}
.aiempty .aisug{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.aisug button{text-align:left;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;padding:10px 12px;font-size:.86em;font-weight:600}
.aimsgs{display:flex;flex-direction:column;gap:10px}
.aim{display:flex;flex-direction:column;max-width:100%}.aim.u{align-items:flex-end}.aim.a{align-items:stretch}
.aim .bub{border-radius:16px;padding:10px 12px;font-size:.9em;line-height:1.5;overflow-wrap:anywhere}

.aim.a .bub{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:6px}
.aim .bub.err{border-color:color-mix(in srgb,var(--red) 50%,transparent);color:var(--text)}.aim .bub.err .btn{margin-top:8px}
.aim .bub.busy{color:var(--dim);font-size:.84em}
.aim .ts{font-size:.68em;color:var(--dim2);margin:3px 6px 0}
.bub.md p{margin:0 0 8px}.bub.md p:last-child{margin-bottom:0}.bub.md p.h{font-weight:750}
.bub.md ul,.bub.md ol{margin:4px 0 8px;padding-left:20px}.bub.md li{margin:3px 0}
.bub.md code{background:var(--card2);border-radius:5px;padding:0 4px;font-size:.92em}
.aitag{display:inline-block;font-size:.68em;font-weight:800;letter-spacing:.03em;padding:1px 6px;border-radius:999px;margin-right:2px;vertical-align:1px}
.aitag.lg{background:var(--tint-b);color:var(--blue)}.aitag.tr{background:var(--tint-g);color:var(--green)}.aitag.pr{background:var(--card3);color:var(--text)}
.aitag.rs{background:var(--card2);color:var(--dim)}.aitag.nr{background:var(--tint-a);color:var(--amber)}
details.aitools{margin:4px 4px 0;font-size:.74em;color:var(--dim)}details.aitools summary{cursor:pointer;font-weight:700}
details.aitools ul{margin:4px 0 0;padding-left:18px}details.aitools li span{color:var(--dim2)}
.dots{display:inline-flex;gap:3px;vertical-align:middle}.dots i{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:aidot 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes aidot{0%,80%,100%{opacity:.25}40%{opacity:1}}

.aicomp{position:sticky;bottom:calc(60px + var(--safe-b));display:flex;gap:8px;align-items:flex-end;background:var(--bg);padding:10px 0 8px;margin-top:10px;z-index:5}
.aicomp textarea{flex:1;min-height:44px;resize:none;line-height:1.35;border-radius:14px}
.aicomp .btn{min-height:44px}
.aifoot{text-align:center;margin:6px 0 0}
.aiconv{background:var(--card);border:1px solid var(--border);border-radius:14px;margin:0 0 8px;padding:4px 4px 6px}
.aiconv.on{border-color:var(--blue)}
.aiopen{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:0;padding:8px 8px 4px;color:var(--text)}
.aiopen b{font-size:.92em}.aiopen span{font-size:.72em;color:var(--dim)}.aiopen i{font-style:normal;font-size:.78em;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aiacts{display:flex;gap:14px;padding:0 8px}.linkbtn.danger,.danger{color:var(--red)}

/* 5.1 — save / update banners, storage meter */

<script>
/* =====================================================================
   PROTOCOL CONTENT — consolidated from your source files.
   Every block carries a source tag. Doses are copied, never invented.
   ===================================================================== */
var SRC={
  V8:"8-Week PPPD Plan + PPPD Rehab app (22 Sep 2026) — authoritative for vestibular",
  V8S:"8-Week PPPD Plan (22 Sep 2026)",
  MP:"My Protocol v4 (18 Sep 2026)",
  BW:"Breathwork Master Guide (14 Sep 2026)",
  MEM:"Your stated notes (chats / saved context)",
  OLDV:"Vestibular Rehab app (6 Sep 2026) — technique wording only; its dosing is superseded",
  MASTER:"Master Protocol build (22 Sep 2026)"
};

/* ---------------- VESTIBULAR 8-WEEK PROGRESSION (verbatim from the PPPD Rehab app) ---------------- */
var VWEEKS=[null,
 {tag:"Foundation",head:"VOR×1 horizontal + vertical, seated, plain background. 30 sec × 2 sets, 1–2×/day.",
  visual:"Level 1 video — gentle stripes / slow scroll, small screen, normal brightness. 60–90 sec × 1–2.",
  balance:"Feet-together stand near a counter, 30 sec × 2.",
  realworld:"Observe & log your triggers — no forced exposure yet.",
  demos:{head:["vor1h","vor1v","headturns"],visual:["okn"],balance:["feettogether"],realworld:[]}},
 {tag:"Building tolerance",head:"VOR×1 horizontal, seated, 45–60 sec × 2–3. Add speed once smooth.",
  visual:"Level 1–2 — enlarge screen or slightly busier scene, 2 min.",
  balance:"Stand on a firm surface, eyes tracking a near target.",
  realworld:"Brief calm-store entry, 1–2 min, off-duty, accompanied if possible.",
  demos:{head:["vor1h"],visual:["okn"],balance:["feettogether"],realworld:[]}},
 {tag:"Standing + gaze",head:"VOR×1 standing, feet apart, plain background, 60 sec × 3. Begin gaze-shift drill.",
  visual:"Level 2 — busy scene / real-world POV walking video, 2–3 min.",
  balance:"Standing head turns; weight shifts.",
  realworld:"Store aisle 3–5 min; slow patterned-floor hallway walk.",
  demos:{head:["vor1h","gazeshift"],visual:["okn"],balance:["weightshift"],realworld:[]}},
 {tag:"Walking begins",head:"VOR×1 standing with busy background; add walking + horizontal head turns (hallway), slow pace.",
  visual:"Level 3 — crowded/motion-rich video, 3–4 min; driving-POV dashcam video (passenger view).",
  balance:"Walk + head turns 20–30 ft; tandem stance near a wall.",
  realworld:"Store 5–8 min; hallway walk turning head to scan; short passenger car rides.",
  demos:{head:["vor1h","walkturns"],visual:["okn"],balance:["walkturns","tandem"],realworld:[]}},
 {tag:"Real-world fusion",head:"Walking + head turns at moderate pace, fixating passing objects. VOR×2 (target & head opposite) horizontal if tolerated.",
  visual:"Level 3–4 — longer POV crowd-walking videos, 5 min. Begin reduced-intensity emergency-light video: small, dim, distant, daytime, 20–30 sec.",
  balance:"Walk + scan in busier settings; pivot turns.",
  realworld:"Warehouse/large store 8–10 min; busier crowds (5/10).",
  demos:{head:["walkturns","vor2"],visual:["okn","elgrade"],balance:["walkturns","pivot"],realworld:[]},el:true},
 {tag:"Driving + scanning",head:"VOR×2 horizontal + vertical; quick head turns/scanning while walking; dual-task (name objects while scanning).",
  visual:"Emergency-light video graded up — larger/brighter/longer (45–90 sec), still stationary. Night-time POV driving video.",
  balance:"Walk + head turn on a compliant surface; stairs with scanning.",
  realworld:"Driving as driver, low-demand settings — empty lot → quiet roads, off-duty.",
  demos:{head:["vor2","walkturns"],visual:["elgrade","okn"],balance:["walkturns"],realworld:[]},el:true},
 {tag:"Fusing it all",head:"Fuse everything — walk, scan, follow a moving object in real hallways. Faster / less-predictable head motion.",
  visual:"Emergency lights: build tolerance stationary → as passenger in a stationary vehicle, lights on (daytime → dusk), short exposures. Patterned/crowded environments at 6/10.",
  balance:"Dynamic gait + head turns + obstacles.",
  realworld:"Progressively longer/busier store & hallway tasks; scene-scanning drills.",
  demos:{head:["walkturns","vor2"],visual:["elgrade"],balance:["walkturns"],realworld:[]},el:true},
 {tag:"Consolidate",head:"Consolidate — near-normal daily head movement with minimal after-rocking. Maintain 3–5×/wk.",
  visual:"Emergency lights: longer/closer exposures, dusk/night, working toward brief in-vehicle-as-passenger. Reassess with clinician before any on-duty light exposure.",
  balance:"Full functional gait/scanning at work pace.",
  realworld:"Job-relevant simulation — scanning buildings/hallways, walking-and-turning at patrol pace. Discuss duty status with clinician.",
  demos:{head:["walkturns"],visual:["elgrade"],balance:["walkturns"],realworld:[]},el:true}
];

/* Week-1 exact schedule (8-Week Plan §3) */
var WEEK1=[
 ["Morning (rested)","VOR×1 horizontal","Seated, plain wall background · eyes fixed on letter at arm's length, turn head L–R ~30–45°, fast enough to just keep letter clear","30 sec × 2 sets","1–2×/day","30–60 sec between sets","3–4/10, settle <15 min","vor1h"],
 ["Morning","VOR×1 vertical (up–down)","Seated, plain background","30 sec × 2 sets","1–2×/day","30–60 sec","≤3/10 (vertical is easier for you)","vor1v"],
 ["Morning","Habituation: seated head turns at a comfortable pace, no target","Seated","10 turns × 2","1×/day","as needed","3–4/10","headturns"],
 ["Midday","Visual-motion desensitization (Level 1) — low-intensity scrolling/optokinetic video (gentle horizontal stripes or slow-scroll text) on a phone at arm's length, small screen, normal brightness","Seated, feet planted","60–90 sec × 1–2","1×/day","60 sec","2–3/10","okn"],
 ["Anytime","Posture track — thoracic extension over towel roll; chin-nod deep neck-flexor holds; scapular setting; doorway pec stretch","Mixed","see Posture","1×/day","—","non-provocative",""],
 ["Evening","Psychoeducation/relaxation — 5 min diaphragmatic breathing; read one PPPD explanation section","Seated/lying","5 min","daily","—","calming",""]
];
var WEEK1_NOTE="Symptom scale 0 = none, 10 = worst. Training target: reach 3–4/10, do not exceed ~a 2–3 point rise over baseline, symptoms settle back toward baseline within ~15 min. (Clinical teaching heuristics, not values validated in PPPD trials; the closest trial-based rule scaled back the next session if symptoms persisted >2 hours and repeated the same dose if they resolved immediately.) Equipment: sticky note with a single letter/“X”, a wall, a firm chair, a tablet/phone for video, optional cushion/foam pad, a towel roll. Vestibular block once or twice daily in week 1 (not the 3–5×/day used for peripheral hypofunction). Total vestibular time week 1 ≈ 8–12 min/day. Wear your glasses if you use them; stand near a counter for any standing drill.";

/* vestibular dose tiers have their own names so Green / Amber / Red only ever mean readiness (the 8-week plan's
   Green / Amber / Red dosing = Full / Maintenance / Gentle) */
var VT_NAME={green:"Full",amber:"Maintenance",red:"Gentle"};
var VTIER={
 green:"<b>Full dose</b> — this week's planned progression.",
 amber:"<b>Maintenance</b> — repeat your last comfortably tolerated level, shortened (~50%). No new progression. Posture &amp; breathing stay in.",
 red:"<b>Gentle</b> — non-provoking work only; provoking items skipped. Resume at your last comfortably tolerated level."};
var VDOSE_AMBER="Maintenance dose — repeat only your last comfortably tolerated level, shortened (~50%). No new progression today.";
var VDOSE_RED="Skipped — flare protocol. Resume next Green day at your last comfortably tolerated level.";
var DUTY_NOTE="<b>Duty safety:</b> Do not run a symptom-provoking session right before you drive on shift. Put habituation, visual-motion, and real-world exposure work earlier in the day, on rested off-time — never in the 2–3 hours before reporting for duty or operating a vehicle.";

var FLARE_REF=[
 ["Full (plan: Green)","Near baseline. Full planned progression for the week."],
 ["Maintenance (plan: Amber)","Mild flare, poor sleep, or a shift day. Maintenance dose only: one shortened block (~5 min) at an already-tolerated level, no new progression. Posture + breathing stay in. Hydrate, eat, cool down."],
 ["Gentle (plan: Red)","Significant flare or post-night crash (dehydrated/overheated/underfed). Gentle, non-provoking work only: DNF holds, thoracic mobility, breathing (movement on Red days follows your Red card). Defer new progression to the next Green day. Address the driver: fluids + salt, eat, cool down, rest."],
 ["Principle","Reduce dose, do not stop entirely — brief total avoidance feeds the threat/avoidance loop and erodes gains (CBT-informed PPPD care)."],
 ["Recovery rule","After any flare, resume at the last comfortably tolerated level, not where you left off — re-earn the progression."],
 ["A flare is","Baseline symptoms clearly elevated, or provocations recover much slower than usual (>30–60 min), often driven by poor sleep (night shifts, infant), heat, dehydration, hunger, or post-bowel-movement lightheadedness."]];
var AUTONOMIC_FIRSTAID=[
 ["Hydration / salt","General orthostatic-intolerance guidance is at least ~2–3 L fluid/day paired with increased sodium; OI protocols cite roughly 3–10 g salt/day, the higher end only under clinician guidance and contraindicated with hypertension, kidney or heart issues. Evidence is low-quality/short-term. Front-load fluids in the morning and before shifts; water alone (without sodium) is less effective. (Your My Protocol sodium line: 3,000–4,000 mg/day — discuss with your prescriber before loading above that.)"],
 ["Heat","Pre-cool, hydrate, avoid provocative exposure when overheated."],
 ["Hunger / post-BM","Likely a transient vagal/orthostatic dip: don't train fasted; sit/brace briefly after a BM; rise slowly."],
 ["Sleep deprivation","Schedule main progression sessions on well-rested off days; maintenance dosing on shift days and the day after nights."]];
var PROGRESSION=[
 ["One variable at a time","Duration → speed → background complexity → position (sit → stand → walk) → real environment."],
 ["Advance when","A level is tolerable (≤3–4/10, recovery <15 min) for 2–3 consecutive sessions."],
 ["Under-dosing signal","No symptom rise at all, no fatigue → progress faster / add a set."],
 ["Over-dosing signal","Peaks >5–6/10, recovery >30–60 min, or next-day baseline creep → cut duration/speed and hold."],
 ["Escalate","If symptoms won't settle within ~15 min even at the gentlest dose → vestibular PT."],
 ["Don't stack","Don't start two new/progressed things on the same day. When you advance vestibular difficulty, hold training and posture steady, and vice versa."],
 ["Expectation","Meaningful change in PPPD typically takes 3–6 months of consistent practice, not 8 weeks. Continue beyond week 8; if the downward trend stalls for 3–4 weeks despite correct dosing, ask your physician about CBT and/or an SSRI/SNRI."]];
var COORD=[
 ["Sequence","Vestibular/visual work when freshest (usually morning on an off day). Posture any time (non-provocative). Keep it a separate block from training: on strength days, after lifting or several hours away from it (My Protocol v4), so you can attribute any symptom change."],
 ["Off / rest days","Main progression day — full vestibular + visual + posture. Training (Strength or Zone 2) follows your rotation schedule."],
 ["Day-shift days","Maintenance vestibular (5 min, tolerated level) + posture resets. No new progression before or during duty."],
 ["Night-shift days & the day after nights","Amber/red dosing — posture, breathing, gentle movement; protect sleep."],
 ["Transition days","Treat as amber; circadian disruption is itself a flare risk."],
 ["Never","Provocative vestibular/visual exposure in the 2–3 hours before operating a patrol vehicle or reporting for duty."],
 ["Training","Strength and Zone 2 come only from your 28-day rotation schedule (My Protocol v4). The vestibular program adds no cardio of its own."]];

var TRIGGERS=[
 ["Steady lighting","Baseline — no training needed",2],
 ["Phone / computer scrolling","Start screen-based desensitization here — scroll text/feeds deliberately, 1–2 min",2],
 ["Driving","Passenger, quiet roads, daytime → short drives as driver in low-demand settings. Job-relevant.",3],
 ["Crowds","Quiet café → moderate store → busier public space; increase density and dwell time",5],
 ["Patterned floors","Walk slowly, looking ahead → then scanning; hallways",6],
 ["Supermarket / warehouse aisles","Simple small store, short visit → large warehouse aisle scanning shelves",6],
 ["Emergency / flashing lights","Top of hierarchy, approached last and cautiously — small, dim, distant, daytime → one variable at a time",8]];
var EL_GRADE="Grade by <b>screen size, brightness, distance, duration, central vs peripheral gaze, daytime vs night, stationary vs in-vehicle</b>. Start with a small, dimmed video of emergency lights at arm's length, viewed peripherally for 20–30 sec in daylight conditions, and advance only one variable at a time. <b>Do not begin flashing-light work until you have been screened for photosensitivity/seizure risk</b>, and never immediately before or during duty.";
var PHOTO="Epilepsy Foundation review (Fisher et al., Epilepsia 2022): flashes brighter than 20 cd/m² at 3–60 (particularly 15–20) Hz occupying at least 10–25% of the visual field are a risk, as are red flashes or oscillating stripes. Light-provoked seizures affect up to 1 in 4000 people. Because you are deliberately and repeatedly self-exposing, mention this to your clinician; an ophthalmology/optometry or neurology opinion (± EEG) is reasonable with any personal/family seizure history, migraine with strong light sensitivity, or any unusual visual/neurological symptom during exposure. Risk reduction: sit well back from the screen, cover one eye, reduce contrast/brightness, avoid dark-room close viewing.";

var SAFETY=[
 ["Urgent / ER","Double vision, slurred speech, trouble swallowing, facial or limb weakness/numbness, severe unsteadiness/inability to walk, severe new headache, loss of consciousness (central “D” red flags — posterior-circulation stroke can mimic dizziness)."],
 ["Points away from pure PPPD","True spinning vertigo attacks, new hearing loss, unilateral tinnitus, ear fullness. Central-type nystagmus (down-beat, direction-changing, not fixation-suppressed)."],
 ["Vestibular PT","Can't progress past ~week 2–3, symptoms flare >24–48 h after appropriately dosed sessions, or unsure how to grade — supervised VRT has the strongest evidence; this home plan is a bridge, not a replacement."],
 ["ENT / neurotologist","Episodic spinning, positional vertigo, hearing/tinnitus changes, or to interpret vHIT/caloric/VEMP results."],
 ["Neurologist","Any central sign, migrainous features (PPPD/vestibular migraine overlap changes treatment), or refractory symptoms."],
 ["Ophthalmology / optometry","Before flashing-light work if any personal/family seizure history, strong light-triggered migraine, or new visual symptoms during light exposure — photosensitivity screen."],
 ["Autonomic clinician","Abnormal orthostatic vitals, or frequent/worsening lightheaded, shaky, near-faint episodes (evaluate for orthostatic hypotension/POTS)."],
 ["Cervical / orthopedic","Neck pain dominates or radiates, or neck treatment dramatically changes your dizziness."],
 ["Occupational / duty status","PPPD and provocative rehab can transiently impair balance and reaction. Do not perform provocative exposure before/during shifts; do not self-clear for emergency-light or high-demand driving tolerance — involve your clinician (and occupational health per department policy). If symptoms ever affect driving Code or scene awareness, report it and get cleared rather than pushing through."],
 ["Cardiac rule (My Protocol)","Stop and get evaluated for chest pain that's new or unlike your usual, fainting or near-fainting, a sustained irregular rhythm, or breathlessness clearly out of proportion to the effort."]];
var TESTS=[
 ["Type & direction of the noted nystagmus","The single most important item. Spontaneous, gaze-evoked, positional, or head-shake? Horizontal, direction-fixed and fixation-suppressed = peripheral/benign. Direction-changing, purely vertical (down-beat) or torsional, or not suppressed by fixation = central sign → evaluate before progressing."],
 ["vHIT (VOR gain + corrective saccades)","Normal horizontal gain ~0.8–1.2. Gain <0.8 with catch-up saccades on one side = unilateral hypofunction → VOR×1 becomes a true adaptation priority. Normal gain with consistent saccades can indicate mild asymmetry."],
 ["Caloric / VNG asymmetry %",">25% generally abnormal; >~40% predicts meaningful unilateral weakness → directional VOR adaptation, tells us which side to bias."],
 ["Positional testing (Dix-Hallpike / roll)","Rule out BPPV — if positive, treated first with repositioning (Epley), not habituation."],
 ["VEMPs (cervical / ocular)","Otolith function; abnormalities refine which motions to target."],
 ["Audiogram","Asymmetric hearing loss/tinnitus/fullness raises Ménière's or retrocochlear concerns."],
 ["Rotary chair / posturography (SOT)","Quantifies visual dependence; a visually dependent SOT pattern supports heavier visual-desensitization dosing."],
 ["MRI brain / IAC","If any central sign or asymmetric audiovestibular finding."],
 ["Orthostatic vitals","Lying → standing HR/BP at 1 and 3 min. OH = SBP drop ≥20 or DBP ≥10 within 3 min. POTS pattern = sustained HR rise ≥30 bpm within 10 min without OH. Either changes the exercise/salt/fluid plan and the flare protocol."]];
var PPPD_EXPLAINED=[
 ["What PPPD is","A functional vestibular disorder: the hardware (inner ear, brain structure) is essentially intact, but the brain has adopted a maladaptive, high-“threat” control strategy — over-weighting visual and surface cues, stiffening postural control, and hypervigilantly monitoring motion. That's why testing was largely normal and why treatment is retraining, not repair. (Bárány criteria, Staab et al. 2017.)"],
 ["Your phenotype","Mixed active-motion/postural + visually dependent: horizontal head motion and busy visual environments dominate, with a musculoskeletal (neck/posture) amplifier and an autonomic/exertional amplifier layered on."],
 ["Priority 1","Head-motion (VOR/habituation) retraining — symptoms within ~5 s of horizontal head movement, worse on stopping, settling in 1–2 min."],
 ["Priority 2 (co-primary)","Visual-motion desensitization — stores/aisles (6/10), patterned floors (6/10), flashing lights (8/10) are visual-dependence phenomena; trained in parallel, then fused with head motion."],
 ["Foundational","Psychoeducation + hypervigilance management (CBT-informed): the threat/avoidance/hypervigilance loop drives chronicity; understanding why symptoms occur and deliberately not avoiding is itself therapeutic."],
 ["Secondary","Posture/neck track — guarding plausibly amplifies head-motion symptoms via cervical proprioception (an amplifier, not the sole cause). Conditioning is handled by your Strength + Zone 2 system."],
 ["Don't","A generic high-intensity VOR blast, or aggressive flashing-light exposure up front — both risk a prolonged flare that reinforces the threat loop."],
 ["Evidence","VRT reduces DHI (Li et al. 2025 meta-analysis, WMD 21.84) but the PPPD trial base is small and heterogeneous (I² ≈ 92% in one meta-analysis). The specific numbers here are clinical judgment, not validated protocol — let your tracking log override any number. In one elderly PPPD RCT, adding optokinetic stimulation slightly blunted gains, so titrate visual-motion dosing to your response rather than maximizing it."],
 ["Medication context","Not a prescription: SSRIs/SNRIs and CBT are established PPPD treatments alongside vestibular rehab (paroxetine/escitalopram; venlafaxine often started at 37.5 mg); response takes 8–12 weeks and if beneficial is generally continued ≥1 year. Decisions with a prescriber, factoring in your safety-sensitive job."]];

/* =====================================================================
   ROTATION + DAY-TYPE ENGINE — ported from My Protocol v4 (18 Sep 2026)
   Pitman 28-day rotation anchored Mon 24 Aug 2026 (position 1).
   ===================================================================== */
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseISO(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function addD(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function fmt(m){m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
function hrs(m){var h=Math.floor(m/60),x=m%60;return h+" h"+(x?" "+String(x).padStart(2,"0"):"")}
var ANCHOR_DEFAULT="2026-08-24";
var BASE="DDOODDDOODDOOONNOONNNOONNOOO".split("");
var LIFTPOS=[3,8,12,18,23,27];
var Z2POS=[4,9,14,17,22,26,28];
function anchorDate(){return parseISO((S.settings&&S.settings.anchor)||ANCHOR_DEFAULT)}
function pos(d){var f=Math.round((d-anchorDate())/86400000);return ((f%28)+28)%28+1}
function dayRec(d){return S.days[iso(d)]||null}
function manualType(d){var r=dayRec(d);return r&&r.type?r.type:null}
function letterForType(t){return t==="DAY"?"D":(t==="FIRST"||t==="MID")?"N":"O"}
/* Schedule changes live on the day record: type (set on Today), det (detail hours), and — from the
   Schedule calendar — swap ("D"/"N"), personal (not working) and partial (worked, base letter kept).
   Every neighbouring day type re-derives from these letters automatically. */
function eff(d){var mt=manualType(d);if(mt)return letterForType(mt);var r=dayRec(d);if(r&&(r.swap==="D"||r.swap==="N"))return r.swap;if(r&&r.personal)return "O";return BASE[pos(d)-1]}
function derivedType(d){
  var s=eff(d),prev=eff(addD(d,-1));
  if(s==="D")return "DAY";
  if(s==="N")return prev==="N"?"MID":"FIRST";
  if(prev==="N"){for(var i=1;i<=3;i++)if(eff(addD(d,i))==="N")return "BRIDGE"; return "RESET"}
  for(var b=1;b<=3;b++){
    if(eff(addD(d,-b))!=="O")break;
    if(eff(addD(d,-b-1))==="N"){var r=true;
      for(var j=1;j<=3;j++)if(eff(addD(d,-b+j))==="N")r=false;
      if(r)return b===1?"STEP1":(b===2?"STEP2":"ALIGNED")}
  }
  if(eff(addD(d,1))==="N"){for(var k=1;k<=3;k++)if(eff(addD(d,-k))==="N")return "HOLD"; return "DELAY"}
  if(eff(addD(d,1))==="O"&&eff(addD(d,2))==="N"){
    for(var q=1;q<=3;q++)if(eff(addD(d,-q))==="N")return "HOLD"; return "DRIFT"}
  return "ALIGNED";
}
/* A traffic detail that lands the morning after a night shift is a "Detail after a night" — decided
   from the neighbouring days, so it stays right if the night before is changed later. */
function dtype(d){var mt=manualType(d);if(mt==="DETAIL"&&eff(addD(d,-1))==="N")return "DETAIL_RED";return mt||derivedType(d)}
/* type a group would resolve to on this date, derived with the group's letter */
function typeForGroup(d,gid){
  var g=GROUPS.filter(function(x){return x.id===gid})[0];
  var k=iso(d),rec=S.days[k]||(S.days[k]={}),save=rec.type;
  rec.type=null;var base=derivedType(d);
  if(g.types.indexOf(base)>-1){rec.type=save;return base}
  /* try deriving as if the date carried the group's letter */
  var cand=g.types[0];
  if(gid==="night"){cand=eff(addD(d,-1))==="N"?"MID":"FIRST"}
  if(gid==="post"){var nightsAhead=false;for(var i=1;i<=3;i++)if(eff(addD(d,i))==="N")nightsAhead=true;cand=nightsAhead?"BRIDGE":"RESET"}
  if(gid==="trans"){cand=eff(addD(d,1))==="N"?"DELAY":(eff(addD(d,2))==="N"?"DRIFT":"STEP1")}
  if(gid==="off"){var nb=false;for(var j=1;j<=3;j++)if(eff(addD(d,-j))==="N")nb=true;cand=(nb&&eff(addD(d,1))==="N")?"HOLD":"ALIGNED"}
  if(gid==="day")cand="DAY";
  rec.type=save;return cand;
}

  var done=0,sd=strengthState().done;

  var v={week:done+1,calendar:n+1,paused:n-done};weekInfo._c={k:key,g:(typeof SAVE_GEN==="number"?SAVE_GEN:0),v:v};return v}

/* ==== timehelpers ==== */
function T(h,m){var v=h*60+(m||0)-240;return v<0?v+1440:v}
function TM(min){var v=min-240;return v<0?v+1440:v}          /* minutes-from-midnight → band */
function TM2(min){return Math.min(min-240+1440,1680)}
function T2(h,m){return Math.min(h*60+(m||0)-240+1440,1680)}

var WAKE_MIN={DAY:330,ALIGNED:390,DRIFT:390,DELAY:480,FIRST:540,MID:870,BRIDGE:870,HOLD:540,
  RESET:780,STEP1:375,STEP2:345,DETAIL_RED:420}; /* RESET's card: "07:45 → 13:00, ALARM" — 13:00 is the wake, not 07:45 */
function nextWakeMin(d){
  var t=dtype(addD(d,1));
  if(t==="DETAIL")return detTimes(addD(d,1)).s-90;
  return WAKE_MIN[t]!=null?WAKE_MIN[t]:390;
}

function detailCard(d){
  var tt=detTimes(d),start=tt.s,end=tt.e;
  var wake=start-90, home=end+30;
  /* bed the night before: 8 h before the wake, but never later than an ordinary off-day bed,
     or a late start would quietly drag the clock later */
  var bedPrev=bedFor(addD(d,-1))%1440;          /* same rule the day before uses — one answer */
  var tomorrowWake=nextWakeMin(d),holdDet=dtype(addD(d,1))==="FIRST";
  var bed=(tomorrowWake+1440)-480;              /* 8 h before tomorrow's wake */
  if(bed<1275)bed=1275; if(bed>1335)bed=1335;   /* hold between 21:15 and 22:15 */
  if(holdDet)bed=1500;                          /* Hold-day detail: 01:00 bed, first-night protocol tomorrow (OT rules) */
  if(bed<home+45)bed=home+45;                   /* never "bed" before you're home */
  var opp=(tomorrowWake+1440)-bed;
  var lateFinish=home>1050, earlyFinish=home<=930;

  if(holdDet)return {name:"Hold-day detail",phase:"night",title:"Hold-day detail",sub:fmt(start)+"–"+fmt(end)+" · home about "+fmt(home)+" · first night tomorrow",
   sleep:"01:00 → 09:00",sleepn:"8 h tonight",nap:"90 min",napn:"45 min after you get home · CPAP on",win:"Nap "+fmt(home+45)+" · bed 01:00 → 09:00",

   flag:{k:"amber",t:"<b>Hold-day detail.</b> Costs roughly 3–4 h of sleep debt across two days and the one good strength session of this night phase. Before a three-night block: decline if you can. Never two Hold-day details in one night phase."}};
  return {name:"Traffic detail",phase:"day",title:"Traffic detail",
   sub:fmt(start)+"–"+fmt(end)+" · home about "+fmt(home),

    [fmt(Math.max(start+60,bed-480)),"Caffeine cutoff — 8 hours before tonight's "+fmt(bed%1440)+" bed."],
    [fmt(end),"Off. Home about "+fmt(home)+"."],

/* =====================================================================
   DEMO ENGINE — offline animated movement demonstrations (SVG)
   A small 2-D forward/inverse-kinematics rig + scene painters.
   Every demo is data: keyframes of numeric pose params, interpolated.
   ===================================================================== */
var RIG={T1:22,T2:22,N:7,HR:10,UA:27,FA:23,TH:41,SH:39,FT:10};
function d2r(a){return a*Math.PI/180}
function vdir(a){var r=d2r(a);return [Math.cos(r),Math.sin(r)]}
function vadd(p,a,l){var d=vdir(a);return [p[0]+d[0]*l,p[1]+d[1]*l]}
function vang(a,b){return Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI}
function vdist(a,b){return Math.hypot(b[0]-a[0],b[1]-a[1])}
/* two-bone IK: returns [joint,end] */
function ik2(root,target,l1,l2,bend){
  var d=Math.max(Math.abs(l1-l2)+0.01,Math.min(l1+l2-0.01,vdist(root,target)));
  var th=vang(root,target);
  var c=(l1*l1+d*d-l2*l2)/(2*l1*d);c=Math.max(-1,Math.min(1,c));
  var al=Math.acos(c)*180/Math.PI;
  var j=vadd(root,th+(bend>0?al:-al),l1);
  var e=vadd(j,vang(j,target),l2);
  return [j,e];
}
function P(p){return p[0].toFixed(1)+","+p[1].toFixed(1)}
function ln(a,b,cls,w){return '<line class="'+cls+'" x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'"'+(w?' stroke-width="'+w+'"':'')+'/>'}
function pl(pts,cls,w){return '<polyline class="'+cls+'" points="'+pts.map(P).join(" ")+'"'+(w?' stroke-width="'+w+'"':'')+'/>'}
function circ(c,r,cls){return '<circle class="'+cls+'" cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" r="'+r+'"/>'}
function txt(x,y,s,cls,anchor){return '<text class="'+(cls||"dl")+'" x="'+x+'" y="'+y+'" text-anchor="'+(anchor||"middle")+'">'+s+'</text>'}
function arrowHead(at,ang,cls){var a=vadd(at,ang+150,7),b=vadd(at,ang-150,7);return '<polygon class="'+(cls||"arrowh")+'" points="'+P(at)+" "+P(a)+" "+P(b)+'"/>'}
function arrow(a,b,cls){return ln(a,b,cls||"arrow")+arrowHead(b,vang(a,b))}
function arc(c,r,a0,a1,cls,head){ /* degrees, screen coords */
  var p0=vadd(c,a0,r),p1=vadd(c,a1,r),large=Math.abs(a1-a0)>180?1:0,sweep=a1>a0?1:0;
  var s='<path class="'+(cls||"arrow")+'" d="M'+P(p0)+' A'+r+','+r+' 0 '+large+','+sweep+' '+P(p1)+'"/>';
  if(head)s+=arrowHead(p1,a1+(sweep?90:-90));
  return s;
}

/* ---------- limb resolver ---------- */
function limb(root,spec,l1,l2){
  if(!spec)return null;
  if(spec.ik)return ik2(root,spec.ik,l1,l2,spec.b||1);
  var j=vadd(root,spec.a[0],l1);return [j,vadd(j,spec.a[1],l2)];
}

/* ---------- SIDE VIEW body ---------- */
function drawSide(p){
  var R=RIG,s="";
  var pel=p.p,mid=vadd(pel,p.t1,R.T1),sh=vadd(mid,p.t2,R.T2);
  var nk=vadd(sh,p.n,R.N),hc=vadd(nk,p.n,R.HR);
  var legs=[["lF",p.lF],["lN",p.lN]],arms=[["aF",p.aF],["aN",p.aN]];
  function leg(spec,cls){if(!spec)return "";var k=limb(pel,spec,R.TH,R.SH);var f=vadd(k[1],spec.f!=null?spec.f:0,R.FT);
    return pl([pel,k[0],k[1]],cls+" limb",9)+ln(k[1],f,cls+" limb",6);}
  function arm(spec,cls){if(!spec)return "";var k=limb(sh,spec,R.UA,R.FA);return pl([sh,k[0],k[1]],cls+" limb",7)+circ(k[1],3.2,cls+"-fill");}
  s+=leg(p.lF,"far")+arm(p.aF,"far");
  s+=pl([pel,mid,sh],"near torso",15)+ln(sh,nk,"near limb",7);
  s+=circ(hc,R.HR,"near-fill head");
  /* face: nose + eye, eye offset toward crown */
  var h=p.h;s+=ln(vadd(hc,h,R.HR-2),vadd(hc,h,R.HR+3),"face",3.2);
  var eye=vadd(vadd(hc,h,4.5),p.n,2.8);s+=circ(eye,1.6,"eye");
  if(p.gaze){s+=ln(eye,p.gaze,"gaze")}
  s+=leg(p.lN,"near")+arm(p.aN,"near");
  return {svg:s,pts:{pel:pel,mid:mid,sh:sh,hc:hc,eye:eye}};
}

/* ---------- FRONT / BACK VIEW body ---------- */
function drawFront(p){
  var R=RIG,s="",lean=p.lean||0;
  var pel=p.p,up=-90+lean,T=R.T1+R.T2;
  var shC=vadd(pel,up,T),perp=up+90;
  var hipL=vadd(pel,perp,-9),hipR=vadd(pel,perp,9),shL=vadd(shC,perp,-17),shR=vadd(shC,perp,17);
  var nk=vadd(shC,up+(p.neck||0),R.N),hc=vadd(nk,up+(p.tilt||0),R.HR);
  function leg(hip,spec){if(!spec)return "";var k=limb(hip,spec,R.TH,R.SH);var ft=spec.f!=null?spec.f:0;
    return pl([hip,k[0],k[1]],"near limb",9)+ln(k[1],vadd(k[1],ft,6),"near limb",6);}
  function arm(sh,spec){if(!spec)return "";var k=limb(sh,spec,R.UA,R.FA);return pl([sh,k[0],k[1]],"near limb",7)+circ(k[1],3.2,"near-fill");}
  s+=leg(hipL,p.lL)+leg(hipR,p.lR);
  s+='<polygon class="near-fill torso-f" points="'+[vadd(hipL,perp,-2),vadd(hipR,perp,2),vadd(shR,up,0),vadd(shL,up,0)].map(P).join(" ")+'"/>';
  s+=pl([shL,shR],"near limb",9);
  if(p.back&&p.scap){ /* scapulae glide: down (0..1), in (0..1) */
    var dn=p.scap.down*6,inn=p.scap.in*3;
    [[-1,shL],[1,shR]].forEach(function(q){var sg=q[0];var c=vadd(vadd(shC,perp,sg*(10-inn)),up,-(11+dn));
      var ti=[c[0]-sg*3,c[1]-9],to=[c[0]+sg*6,c[1]-8],tip=[c[0]-sg*2,c[1]+11];
      var rot=-sg*(p.scap.rot||0);if(rot){var pv=to;[ti,tip].forEach(function(q,qi){var dx=q[0]-pv[0],dy=q[1]-pv[1],r=d2r(rot);var nq=[pv[0]+dx*Math.cos(r)-dy*Math.sin(r),pv[1]+dx*Math.sin(r)+dy*Math.cos(r)];if(qi===0)ti=nq;else tip=nq})}
      s+='<polygon class="scap" points="'+[ti,to,tip].map(P).join(" ")+'"/>';});
  }
  s+=ln(shC,nk,"near limb",7)+circ(hc,R.HR,"near-fill head");
  if(!p.back){var tn=p.turn||0,ta=up+(p.tilt||0)+90;
    var e1=vadd(vadd(hc,ta,-3.6+tn*4.5),up+(p.tilt||0),1.5),e2=vadd(vadd(hc,ta,3.6+tn*4.5),up+(p.tilt||0),1.5);
    if(Math.abs(tn)<0.85)s+=circ(e1,1.5,"eye");
    if(Math.abs(tn)<0.85||tn>0)s+=circ(e2,1.5,"eye");
    if(Math.abs(tn)>=0.85){}
    s+=ln(vadd(vadd(hc,ta,tn*7.5),up+(p.tilt||0),-1),vadd(vadd(hc,ta,tn*8.5),up+(p.tilt||0),-4.5),"face",2.4);
  }else{s+='<path class="hair" d="M'+P(vadd(hc,up+(p.tilt||0)+90,-9))+' A10,10 0 0,1 '+P(vadd(hc,up+(p.tilt||0)+90,9))+'"/>'}
  s+=arm(shL,p.aL)+arm(shR,p.aR);
  return {svg:s,pts:{pel:pel,shC:shC,shL:shL,shR:shR,hc:hc}};
}

/* ---------- TOP-DOWN body (shoulders, head, arms) ---------- */
function drawTop(p){
  var s="",c=p.c,rot=p.rot||0; /* rot: body facing, -90 = facing up the screen */
  var perp=rot+90;var shL=vadd(c,perp,-19),shR=vadd(c,perp,19);
  function arm(sh,spec){if(!spec)return "";var k=limb(sh,spec,RIG.UA,RIG.FA);return pl([sh,k[0],k[1]],"near limb",7)+circ(k[1],3.4,"near-fill");}
  s+=arm(shL,p.aL)+arm(shR,p.aR);
  if(p.band){var kL=limb(shL,p.aL,RIG.UA,RIG.FA)[1],kR=limb(shR,p.aR,RIG.UA,RIG.FA)[1];s+=ln(kL,kR,"band",3)}
  s+='<ellipse class="near-fill torso-f" cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" rx="22" ry="10" transform="rotate('+(rot+90).toFixed(1)+' '+c[0].toFixed(1)+' '+c[1].toFixed(1)+')"/>';
  var hy=(p.yaw||0)+rot;s+=circ(c,10,"near-fill head");
  s+=ln(vadd(c,hy,8),vadd(c,hy,14),"face",3.2);
  return {svg:s,pts:{shL:shL,shR:shR}};
}

/* ---------- interpolation ---------- */
function lerpObj(a,b,t){
  if(typeof a==="number")return a+(b-a)*t;
  if(Array.isArray(a))return a.map(function(v,i){return lerpObj(v,b[i],t)});
  if(a&&typeof a==="object"){var o={};for(var k in a){if(k==="b"||typeof a[k]==="boolean"||typeof a[k]==="string")o[k]=(t<0.5?a[k]:(b[k]!==undefined?b[k]:a[k]));else o[k]=(b&&b[k]!==undefined)?lerpObj(a[k],b[k],t):a[k];}return o}
  return a;
}
function ease(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
function deepMerge(base,over){if(!over)return base;var o=JSON.parse(JSON.stringify(base));for(var k in over){if(over[k]&&typeof over[k]==="object"&&!Array.isArray(over[k])&&o[k]&&typeof o[k]==="object"&&!Array.isArray(o[k]))o[k]=deepMerge(o[k],over[k]);else o[k]=over[k]}return o}

function vestTierWhy(d){var t=dtype(d),g=GROUPS.filter(function(x){return x.id===TYPE_GROUP[t]})[0],r=S.days[iso(d)],sm=r?sleepMinOf(r.track):null,ps=((r&&r.issue==="Poor Sleep"&&sm==null)||(sm!=null&&sm<360))?1:0;
  var rf=readyForPlan(d),P=[{s:g?g.sev:0,w:(TYPE_SHORT[t]||t)+" (day type)"},{s:SEV[rf],w:"readiness "+rf},{s:ps,w:"sleep under 6 h"}];
  var cc=typeof carryCap==="function"?carryCap(d,"vest"):null;if(cc)P.push({s:SEV[cc.v],w:cc.rule.title.toLowerCase(),rule:cc.rule});
  var m=Math.max.apply(null,P.map(function(x){return x.s}));
  return {tier:TIERS[m],by:m?P.filter(function(x){return x.s===m}).map(function(x){return x.w}):[],rule:cc&&SEV[cc.v]===m?cc.rule:null}}
function vestTier(d){return vestTierWhy(d).tier}
function groupOf(d){return TYPE_GROUP[dtype(d)]}
function tierChip(t){return t==="green"?"g":t==="red"?"r":"a"}

/* ---------- migration from sibling apps on the same site (read-only) ---------- */
function findSiblingData(){
  var out={pppd:null,mp:null};
  var DATE=/^\d{4}-\d{2}-\d{2}$/;
  function obj(k){try{var v=JSON.parse(localStorage.getItem(k)||"null");return v&&typeof v==="object"&&!Array.isArray(v)?v:null}catch(e){return null}}
  function filt(o,okv){if(!o)return null;var r={},n=0;Object.keys(o).forEach(function(k){if(DATE.test(k)&&okv(o[k])){r[k]=o[k];n++}});return n?r:null}
  try{var p=JSON.parse(localStorage.getItem("pppd_state")||"null");if(p&&typeof p==="object"&&Array.isArray(p.log)&&("week" in p))out.pppd=p}catch(e){}
  try{var st=localStorage.getItem("start"),sq=localStorage.getItem("seqn");
    var mp={start:st&&DATE.test(st)?st:null,seqn:sq!=null&&/^\d+$/.test(sq)?+sq:null,
      assign:filt(obj("assign"),function(v){return v==="A"||v==="B"||v==="C"}),
      ovs2:filt(obj("ovs2"),function(v){return v&&typeof v==="object"&&["off","swD","swN","det","part"].indexOf(v.t)>-1}),
      log:filt(obj("log"),function(v){return v==="G"||v==="Y"||v==="R"})};
    /* only treat it as My Protocol data if its signature keys are present */
    if(mp.start&&(mp.seqn!=null||mp.assign||mp.log||mp.ovs2))out.mp=mp}catch(e){}
  return out;
}
function importSiblings(manual){
  var f=findSiblingData(),msgs=[];
  if(f.pppd){var p=f.pppd,n=0;
    if(p.week)S.settings.vestWeek=Math.max(1,Math.min(8,+p.week||1));
    (p.log||[]).forEach(function(e){if(!e||!e.date)return;var r=recKey(e.date);r.track=r.track||{};var t=r.track;
      function put(k,v){if(v!==undefined&&v!==""&&t[k]==null)t[k]=v}
      put("sleepHrs",e.sleep?+e.sleep:undefined);put("sleepMin",e.sleep?Math.round(+e.sleep*60):undefined);put("sleepQ",e.sleepQ?+e.sleepQ:undefined);put("hydration",e.hydration?+e.hydration:undefined);
      put("ate",e.ate);put("baseline",e.baseline?+e.baseline:undefined);put("vestPeak",e.vestPeak?+e.vestPeak:undefined);put("vestRec",e.recovery?+e.recovery:undefined);
      put("realWorld",e.realWorld);put("cardioNote",e.aerobic);put("autonomic",e.autonomic);put("notes",e.note);n++});
    msgs.push("PPPD Rehab app: week "+S.settings.vestWeek+", "+n+" log entries");}
  if(f.mp){var m=f.mp;
    if(m.start&&!S.settings.programStart)S.settings.programStart=m.start;
    if(m.seqn!=null&&!isNaN(+m.seqn)&&!Object.keys(strengthState().done).length)strengthState().override={letter:LETTERS[(+m.seqn)%3],ts:Date.now(),imported:true};
    if(m.log)Object.keys(m.log).forEach(function(k){var r=recKey(k);if(!r.ready)r.ready=m.log[k]==="G"?"green":m.log[k]==="R"?"red":"amber"});
    if(m.ovs2)Object.keys(m.ovs2).forEach(function(k){var o=m.ovs2[k],r=recKey(k);if(r.type)return;
      if(o.t==="swD")r.swap="D";else if(o.t==="det"){r.type="DETAIL";r.det={s:o.s!=null?o.s:420,e:o.e!=null?o.e:900}}
      else if(o.t==="swN")r.swap="N";else if(o.t==="off")r.personal=true;else if(o.t==="part")r.partial=true});
    SCHED_REV++;
    msgs.push("My Protocol: programme start "+(S.settings.programStart||"—")+", strength sequence, colours, schedule changes");}
  if(msgs.length){S.changelog.push({id:"mig"+Date.now(),d:iso(new Date()),sec:"Data import",old:"—",nw:msgs.join(" · "),src:"Same-site saved data",notes:manual?"Manual import":"Automatic first-run import"})}
  S.migrated=true;save();return msgs;
}

/* =====================================================================
   HORMONES / PEPTIDES — only Testosterone, HGH, Retatrutide.
   Doses are the user's stated protocol; math is shown, never used to
   change a dose. Reported syringe draws are never recalculated unless
   the vial strength and water volume are entered.
   ===================================================================== */
var DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],DOWL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function fmtN(x,d){if(x==null||!isFinite(x))return "—";var m=Math.pow(10,d);return String(Math.round(x*m)/m)}
function daysTxt(days){if(!days||!days.length)return "no days set";if(days.length===7)return "Every day";return days.slice().sort().map(function(i){return DOW[i]}).join(" & ")}
function hItem(id){return [].concat(S.reg.hormones,S.reg.peptides).filter(function(x){return x.id===id})[0]||null}
function retaCalc(x){var ok=x&&x.vialMg>0&&x.bacMl>0&&x.perDoseMg>0;if(!ok)return null;
  var conc=x.vialMg/x.bacMl,ml=x.perDoseMg/conc;return {conc:conc,ml:ml,u:ml*100,unitsFor:function(mg){return mg/conc*100}}}
function hghCalc(x){if(!(x&&x.vialIU>0&&x.bacMl>0&&x.iu>0))return null;var iuPerMl=x.vialIU/x.bacMl,ml=x.iu/iuPerMl;return {iuPerMl:iuPerMl,ml:ml,u:ml*100}}
function mainSleepLabel(d){var t=dtype(d),b=bedFor(d)%1440;
  if(t==="FIRST"||t==="MID")return "after tonight's shift, ~"+fmt(b)+" (CPAP on)";
  return "tonight, ~"+fmt(b);}
