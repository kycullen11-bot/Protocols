/* =====================================================================
   ADAPTIVE ENGINE — the single source of truth for the daily decision.
   Today, Tracking, Protocols and Weekly Review all call these:

     getSleepContext(d)        sleep logged vs planned, band, intentional?
     getAdaptiveReadiness(d)   Green/Amber/Red + issue + symptom overrides
     getScheduledSession(d)    what the 28-day rotation maps for the day
     getTrainingDecision(d)    ACTUAL SLEEP + HOW YOU FEEL + DAY TYPE
                               + RECENT LOAD + SCHEDULED SESSION = plan
     getNapRecommendation(d)   25 / 45 / 60 / 90 min, or none, and why
     getNextStrengthWorkout()  A → B → C state (advances on completion only)
     getRecoveryContext(d)     last 7 days, facts only (no score)
     carryOver(d)              what the last few days change about today (only ever more cautious)
     vestAdvance() / vestSession(k)  vestibular progression suggested from how sessions went
     snapshotPlan(d)           per-day record of what was decided and why
   ===================================================================== */

/* ---------- thresholds (your stated rules) ---------- */
var SLEEP_FULL=420;          /* ≥ 7 h  → scheduled session stands                  */
var SLEEP_CUT=330;           /* < 5.5 h → hard Strength / dedicated Zone 2 removed */
var VEST_POOR_SLEEP=360;     /* < 6 h  → vestibular Amber floor ("poor sleep") — see Needs Review */
var NAP_BUFFER={25:420,45:450,60:480,90:510};   /* nap must END this long before tonight's bed */

/* ---------- time helpers ---------- */
function fmtDur(m){if(m==null||isNaN(m))return "—";m=Math.round(m);var h=Math.floor(m/60),x=m%60;return h+" h "+String(x).padStart(2,"0")+" min"}
function fmtDurS(m){if(m==null||isNaN(m))return "—";m=Math.round(m);var h=Math.floor(m/60),x=m%60;return h+" h"+(x?" "+String(x).padStart(2,"0"):"")}
function sleepMinOf(t){if(!t)return null;if(t.sleepMin!=null&&t.sleepMin!==""&&!isNaN(+t.sleepMin))return +t.sleepMin;
  if(t.sleepHrs!=null&&t.sleepHrs!==""&&!isNaN(+t.sleepHrs))return Math.round(+t.sleepHrs*60);return null}
function setSleepMin(date,m){SAVE_GEN++;var r=recKey(date);r.track=r.track||{};
  /* an empty total never touches the fell-asleep / woke times: if both are there the total comes back from them,
     otherwise the total is simply cleared. Only "clear" (clearSleep) removes the times too. */
  if(m==null||isNaN(m)){var sp=sleepSpan(r.track.sleepStart,r.track.sleepEnd);if(sp!=null){m=sp}else{delete r.track.sleepMin;delete r.track.sleepHrs;save();syncReadiness(date);return}}
  m=Math.max(0,Math.min(960,Math.round(m)));r.track.sleepMin=m;r.track.sleepHrs=Math.round(m/60*100)/100;
  save();syncReadiness(date)}
function clearSleep(date){var r=recKey(date);r.track=r.track||{};delete r.track.sleepStart;delete r.track.sleepEnd;delete r.track.sleepMin;delete r.track.sleepHrs;save();syncReadiness(date)}

/* ---------- planned wake / bed for each day type ---------- */
var BED_MIN={DAY:1290,ALIGNED:1320,DRIFT:1425,DELAY:1530,FIRST:1905,MID:1905,BRIDGE:1500,HOLD:1500,RESET:1320,STEP1:1305,STEP2:1290,DETAIL_RED:1260};
var DAY_ALIGNED={DAY:1,ALIGNED:1,STEP1:1,STEP2:1};
function wakeFor(d){var t=dtype(d);if(t==="DETAIL")return detTimes(d).s-90;
  if(t==="BRIDGE"&&dtype(addD(d,1))==="DETAIL")return 750;          /* modified Bridge before a Hold-day detail: 07:45 → 12:30 (OT rules) */
  return WAKE_MIN[t]!=null?WAKE_MIN[t]:390}
/* tonight's bed (minutes from today's midnight; >1440 = after midnight). On day-aligned days it is pulled
   earlier when tomorrow's wake needs it, so there is always an 8-h opportunity (e.g. off day before a day shift → 21:30). */
function bedFor(d){var t=dtype(d);if(t==="DETAIL")return detailCard(d).bed;var b=BED_MIN[t]!=null?BED_MIN[t]:1320;
  if(DAY_ALIGNED[t]){var nw=wakeFor(addD(d,1));if(nw!=null&&nw<720){var need=nw+1440-480;if(need<b)b=Math.max(need,1230)}}
  if(t==="BRIDGE"&&dtype(addD(d,1))==="DETAIL")b=wakeFor(addD(d,1))+1440-540;   /* 9 h in bed before the detail wake */
  return b}
function adjustCard(d,c){
  /* two off days between nights (e.g. a personal day mid-block): the first Hold isn't the day before a first night */
  if(c&&dtype(d)==="HOLD"&&eff(addD(d,1))!=="N"){var o3=Object.assign({},c);o3.sub="Off between nights — nights resume in 2 days";o3.napn="25 min only after under 5.5 h";
    o3.seq=c.seq.map(function(r){return /tomorrow for the first night/.test(r[1])?[r[0],"Bed. Wake 09:00 tomorrow — another Hold day before the first night."]:r});return o3}
  if(c&&dtype(d)==="BRIDGE"&&dtype(addD(d,1))==="DETAIL"){var bb=bedFor(d),o2=Object.assign({},c);
    o2.name="Bridge before a Hold-day detail";o2.sleep="07:45 → 12:30 (alarm) · bed "+fmt(bb%1440);o2.sleepn="4 h 45, then ~9 h in bed tonight";o2.win=o2.sleep;
    o2.segs=[["shift",0,T(7,0)],["sleep",T(7,45),T(12,30)],["lamp",T(12,30),T(13,0)],["train",T(14,30),T(15,0)],["sleep",T(Math.floor((bb%1440)/60),bb%60),W]];
    o2.seq=[["07:45","Sleep with an alarm at 12:30 — longer than a Reset, short enough that you'll sleep tonight."],["12:30","Caffeine, then outside 20–30 min. Use the light box today — unlike a normal Bridge you do want to advance."],["14:30","Easy outdoor walk, 30 min."],["15:00","Caffeine cutoff. No naps after."],["19:30","Melatonin 0.5 mg."],[fmt(bb%1440),"Bed, aiming for 9 hours in bed before the detail."]];
    o2.flag={k:"amber",t:"<b>Modified Bridge</b> (your overtime rules) because tomorrow is a Hold-day detail."};return o2}
  if(!c||!DAY_ALIGNED[dtype(d)])return c;var t=dtype(d),b=bedFor(d);if(b===BED_MIN[t])return c;
  var nw=wakeFor(addD(d,1)),o=Object.assign({},c),old=fmt(BED_MIN[t]);
  o.sleep=fmt(b)+" → "+fmt(nw);o.win=o.sleep;o.sleepn=hrs(nw+1440-b);
  o.seq=c.seq.map(function(r){return r[0]===old&&/Lights out/.test(r[1])?[fmt(b),"Lights out — 8 h before tomorrow's "+fmt(nw)+" wake."]:r});
  o.segs=c.segs.map(function(s,i){return (s[0]==="sleep"&&i===c.segs.length-1)?["sleep",T(Math.floor(b/60),b%60),T2(Math.floor(nw/60),nw%60)]:s});
  return o}

/* ---------- SLEEP ---------- */
/* The main sleep that ENDS on this protocol day (the one you log when you wake up). */
var DAYTIME_SLEEP={MID:1,BRIDGE:1,RESET:1};
var INTENTIONAL={RESET:"Your Reset sleep is deliberately short (alarm at 13:00) so there is pressure to sleep tonight on the day clock.",
  FIRST:"Your pre-first-night sleep is deliberately 7½–8 h so the 14:00 90-min nap happens.",
  MID:"Between-nights daytime sleep — don't force eight.",
  BRIDGE:"Post-night daytime sleep, no alarm."};
function mainSleepPlan(d){
  var t=dtype(d);if(t==="DETAIL_RED")return {t:t,none:true,min:0,start:null,wake:null,daytime:false,intentional:null,why:"straight off a night shift onto a detail"};
  var wake=wakeFor(d),start=DAYTIME_SLEEP[t]?465:bedFor(addD(d,-1))-1440,min=wake-start;
  /* a night shift that runs into this day's start (e.g. one swapped night before a day shift): no main sleep window */
  if(min<120&&!DAYTIME_SLEEP[t])return {t:t,none:true,noWindow:true,min:0,start:null,wake:wake,daytime:false,intentional:null,why:"a night shift runs straight into today's "+(TYPE_SHORT[t]||"day").toLowerCase()};
  if(min<180||min>660)min=Math.max(180,Math.min(660,min));
  return {t:t,start:start,wake:wake,min:min,daytime:!!DAYTIME_SLEEP[t],intentional:INTENTIONAL[t]||null};
}
function getSleepContext(d){
  var r=S.days[iso(d)]||{},m=sleepMinOf(r.track),pl=mainSleepPlan(d);
  var o={logged:m!=null,min:m,plan:pl,planned:Math.min(pl.min,510),band:null,deficit:null,label:m!=null?fmtDur(m):"not logged",intentional:!!pl.intentional,onPlan:false,assumed:false};
  if(m==null){if(r.issue==="Poor Sleep"){o.band="mid";o.assumed=true}return o}
  o.band=m>=SLEEP_FULL?"full":m>=SLEEP_CUT?"mid":"short";
  o.deficit=Math.max(0,o.planned-m);                 /* SLEEP DEFICIT = planned sleep for this day type − actual */
  o.onPlan=!!pl.intentional&&m>=pl.min-45;          /* on a deliberately short day, near-plan sleep is not debt */
  return o;
}
function bandLabel(b){return b==="full"?"7 h or more":b==="mid"?"5.5–6.9 h":b==="short"?"under 5.5 h":"—"}

/* ---------- READINESS (how you feel wins over any single wearable number) ---------- */
function getAdaptiveReadiness(d){
  var k0=iso(d);
  if(isAutoDay(k0)){
    /* automatic readiness (readiness.js). The training table, nap size and vestibular tier read the symptom colour
       ("feel"); sleep keeps its own column in each of them, exactly as when the colour was tapped by hand. */
    var R=getReadiness(d),c=R.calc,r0=S.days[k0]||{},iss=r0.issue||"Normal",nt=[],fl=colLetter(R.feel);
    var why=R.feel!=="red"?[]:c&&c.hardStops.length?c.hardStops.map(function(x){return x.w}):R.source==="override"?["readiness set to Red by hand"]:["several problems together ("+c.majors.map(function(x){return x.w}).join(", ")+")"];
    if(R.source==="empty")nt.push("Morning check-in not done yet — Amber rules apply until it is.");
    else if(R.source==="auto"&&c.status==="incomplete")nt.push("Check-in incomplete ("+c.missing.join(", ")+") — runs as Amber until it's answered.");
    if(R.source==="override")nt.push("Readiness set by hand to "+cap(R.override.color)+" (calculated: "+(c.status==="empty"?"not checked in":cap(c.color))+")"+(R.held?" — still Red: an override can't lift a hard stop.":R.capped?" — run as Amber: three major problems together can be lowered to Amber at most.":".")+(R.vestFeel&&SEV[R.vestFeel]>SEV[R.feel]?" Vestibular stays at the calculated "+cap(R.vestFeel)+" dose — an override never lifts it.":""));
    if(R.staleOverride)nt.push("Your override to "+cap(R.staleOverride.color)+" was set before your latest answers, which are more cautious — it's no longer applied. Override again if you still disagree.");
    else if(c&&c.sleepLimited&&c.status==="complete")nt.push("Readiness is "+cap(R.color)+" because of sleep; training uses the sleep rules for that, with your symptoms "+(R.feel==="green"?"otherwise Green":"at "+cap(R.feel))+".");
    if(R.source==="override"&&R.feel==="green"&&sleepMinOf(r0.track)==null&&iss!=="Poor Sleep")nt.push("Green takes full effect once your sleep is logged — until then training stays at the conservative version and vestibular runs at Amber.");
    return {ready:R.source==="empty"?null:R.color,unset:R.source==="empty",issue:iss,col:fl,eff:fl,poor:R.feel==="red",poorWhy:why,notes:nt,auto:true,source:R.source};
  }
  var r=S.days[iso(d)]||{},t=r.track||{},rc=r.rc||{},ready=r.ready||null,issue=r.issue||"Normal",poor=[],notes=[];
  var col=ready==="green"?"G":ready==="red"?"R":"Y";
  if(ready==="red")poor.push("readiness Red");
  if(issue==="Illness")poor.push("illness");
  if(t.energy!=null&&t.energy!==""&&+t.energy<=3)poor.push("energy "+t.energy+"/10");
  if(t.dizziness!=null&&t.dizziness!==""&&+t.dizziness>=7)poor.push("dizziness "+t.dizziness+"/10");
  if(t.autonomic==="Notable")poor.push("notable autonomic symptoms");
  if(rc.ill==="R")poor.push("illness");if(rc.gut==="R")poor.push("feeling genuinely unwell");if(rc.breath==="R")poor.push("breathing / rhythm flag");if(rc.pppd==="R")poor.push("dizziness 7+ / balance unsafe");
  poor=poor.filter(function(x,i){return poor.indexOf(x)===i});
  var eff=col;
  if(col==="G"&&(issue==="Fatigue"||issue==="Dizziness / PPPD")){eff="Y";notes.push("You flagged "+issue+", so training runs as Amber.")}
  if(!ready)notes.push("Readiness not set — Amber rules apply until you tap a colour.");
  if(ready==="green"&&sleepMinOf(t)==null&&issue!=="Poor Sleep")notes.push("Green takes full effect once your sleep is logged — until then training stays at the conservative version and vestibular runs at Amber.");
  if(poor.length)eff="R";
  return {ready:ready,unset:!ready,issue:issue,col:col,eff:eff,poor:poor.length>0,poorWhy:poor,notes:notes};
}

/* ---------- STRENGTH A → B → C (advances only on a completed session) ---------- */
function strengthState(){if(!S.strength||typeof S.strength!=="object")S.strength={done:{},override:null};if(!S.strength.done)S.strength.done={};return S.strength}
function lastStrength(){var st=strengthState(),ks=Object.keys(st.done).sort();if(!ks.length)return null;
  var k=ks[ks.length-1];return {date:k,letter:st.done[k].letter,ts:st.done[k].ts||0}}
function getNextStrengthWorkout(){
  var st=strengthState(),last=lastStrength(),o=st.override;
  if(o&&LETTERS.indexOf(o.letter)>-1&&(!last||(o.ts||0)>=(last.ts||0)))return {letter:o.letter,last:last,manual:true};
  if(!last)return {letter:"A",last:null,manual:false};
  return {letter:LETTERS[(LETTERS.indexOf(last.letter)+1)%3],last:last,manual:false};
}
function nextLetter(){return getNextStrengthWorkout().letter}
function letterForDay(d){var k=iso(d),st=strengthState();if(st.done[k])return st.done[k].letter;
  var tk=iso(protoToday());if(k>tk)return projectedLetter(d);   /* future: read-only preview, never stored */
  var r=S.days[k];if(k<tk&&r&&r.plan&&r.plan.sched&&r.plan.sched.letter)return r.plan.sched.letter;
  return nextLetter()}
/* FUTURE A → B → C PREVIEW. Starting from the real "next" workout, each future genuine lift
   opportunity (same day-type rules, planned schedule changes included) takes the next letter in
   turn: A, B, C, A… It is computed, never written: viewing the calendar can't move the sequence or
   freeze a letter onto a future date. If today is itself a lift day whose session is still ahead,
   today's letter counts as used, so the calendar reads today A, then B, C, A. Once today is logged
   the real sequence moves (or, if skipped or removed, rightly doesn't) and the preview follows it. */
var PROJ=null,SCHED_REV=0;
function projReset(){PROJ=null}
function isLiftSlot(d){return getScheduledSession(d,true).kind==="lift"}
function todayLiftPending(){var t=protoToday(),k=iso(t);
  if(!isLiftSlot(t)||strengthState().done[k])return false;
  var tr=(S.days[k]||{}).track||{};if(tr.workout)return false;
  var dc=getTrainingDecision(t);return dc.kind==="lift"&&dc.status!=="completed"}
function projectedLetter(d){
  var t=protoToday(),nl=nextLetter(),sig=iso(t)+"|"+nl+"|"+SCHED_REV+"|"+JSON.stringify(S.days[iso(t)]||{});
  if(!PROJ||PROJ.sig!==sig)PROJ={sig:sig,day0:addD(t,1),base:LETTERS.indexOf(nl)+(todayLiftPending()?1:0),cum:[0]};
  var n=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-PROJ.day0)/86400000);if(n<0)n=0;
  while(PROJ.cum.length<=n){var i=PROJ.cum.length-1;PROJ.cum.push(PROJ.cum[i]+(isLiftSlot(addD(PROJ.day0,i))?1:0))}
  return LETTERS[(PROJ.base+PROJ.cum[n])%3]}
/* idempotent: tapping twice can never advance twice; unchecking restores the previous state */
function setStrengthCompleted(d,on,letter){
  var k=iso(d),st=strengthState(),r=rec(d);r.track=r.track||{};
  /* a real completion takes the real next workout — never a calendar preview letter */
  if(on){if(!st.done[k])st.done[k]={letter:letter||(k>iso(protoToday())?nextLetter():letterForDay(d)),ts:Date.now()};r.track.workout="Done";r.track.workoutLetter=st.done[k].letter}
  else{var was=st.done[k],last=lastStrength();delete st.done[k];if(r.track.workout==="Done")delete r.track.workout;delete r.track.workoutLetter;
    if(was&&last&&last.date===k)st.override={letter:was.letter,ts:Date.now()}}   /* unticking the latest session puts that workout back as next */
}
function setNextStrength(L){strengthState().override={letter:L,ts:Date.now()};save()}

/* ---------- SCHEDULED SESSION (the rotation, before sleep/readiness) ---------- */
function z2Range(txt){var m=/(\d+)\s*[–-]\s*(\d+)/.exec(txt||"");if(m)return [+m[1],+m[2]];m=/(\d+)/.exec(txt||"");return m?[+m[1],+m[1]]:[20,25]}
function getScheduledSession(d,shapeOnly){
  var t=dtype(d),p0=pos(d),lift=LIFTPOS.indexOf(p0)>-1,z2=Z2POS.indexOf(p0)>-1,zb=Z2BAND[band()];
  var s={t:t,kind:"walk",title:"",note:"",fixed:false,circ:null,letter:null,z2txt:null};
  function L(){s.kind="lift";if(shapeOnly){s.title="Workout";return}s.letter=letterForDay(d);s.title="Workout "+s.letter}
  if(t==="DETAIL_RED"){s.kind="red";s.fixed=true;s.title="Recovery only";s.note="Walk if you can, non-provoking vestibular work, breathing. Nothing else for 48 hours.";return s}
  if(t==="FIRST"||t==="MID"){s.fixed=true;s.title="Walking only";s.note=(t==="FIRST"?"The 14:00 nap is worth more than any session.":"Recovery-debt period, not a training period.")+" No strength, no dedicated Zone 2 on any night-shift day.";return s}
  if(t==="DAY"){s.fixed=true;s.title="Patrol steps + mobility";s.note="No hard training on a day shift. One 15-minute decompression walk after you're home, then 8–10 min mobility.";return s}
  if(t==="DRIFT"){s.fixed=true;s.title="Mobility + easy walk";s.note="Nothing mapped. This day's only job is to sit 90 minutes later without adding a variable.";return s}
  if(t==="RESET"){s.kind="z2";s.circ="reset";s.title="Outdoor walk, 30–45 min";s.z2txt="30–45 min";s.note="Circadian first: the afternoon daylight moves your clock back toward days. No strength today.";return s}
  if(t==="BRIDGE"){s.kind="z2";s.circ="bridge";s.title="Outdoor Zone 2 walk, 30–40 min";s.z2txt="30–40 min";s.note="The only training today. Outdoors — the daylight does double duty. No strength.";return s}
  if(t==="DELAY"){s.kind="z2";s.title="Easy Zone 2, 30 min";s.z2txt="30 min";s.note="No strength before a night block. Best full-recovery day of the cycle.";return s}
  if(t==="DETAIL"&&detailCard(d).holdDet){s.fixed=true;s.title="Mobility + walk";s.note="Hold-day detail: the standing and sitting are the load. Strength isn't moved — the sequence waits.";return s}
  if(t==="DETAIL"){var dc=detailCard(d);
    if(dc.earlyFinish&&lift){L();s.detail=true;s.note="Home by "+fmt(dc.home)+", so the mapped session survives. Seated substitutions — you've been on your feet all day. No load increases.";return s}
    if(!dc.lateFinish&&z2){s.kind="z2";s.title="Zone 2 · 20–25 min";s.z2txt="20–25 min";s.note="Home by "+fmt(dc.home)+" and it was a mapped Zone 2 day. Bike over treadmill.";return s}
    s.fixed=true;s.title="Mobility + walk";s.note="Detail day: strength isn't moved — the A → B → C sequence simply waits for the next mapped session.";return s}
  if(lift){L();if(t==="HOLD")s.note="The one rested, no-shift-tonight strength opportunity inside the night phase.";return s}
  if(z2){s.kind="z2";s.title="Zone 2 · "+zb.d;s.z2txt=zb.d;s.note=zb.f+" · target "+zb.wk;return s}
  s.fixed=true;s.title="Mobility + walk";s.note="No mapped session today. Mobility 8–10 min, easy walk, vestibular per tier.";return s;
}

/* ---------- TRAINING DECISION ---------- */
/* level: 0 full · 1 reduced · 2 minimum. status: full | reduced | removed | none | circadian | completed */
function strengthVersion(level,L){
  if(level===0)return {txt:WK[L].focus+" · "+setsFor().s+" · "+setsFor().r,mode:"G",min:"45–65 min"};
  if(level===1)return {txt:"Reduced: one work set of the first five exercises · RPE ceiling 7 · no load progression · arms, extra core and finishers cut · 30–40 min",mode:"Y",min:"30–40 min"};
  return {txt:"Minimum: one work set of the first three exercises · RPE ceiling 6–7 · no load progression · everything else cut · 25–30 min",mode:"Y2",min:"25–30 min"};
}
function z2Version(cut,txt){var r=z2Range(txt);if(!cut)return {txt:txt,range:r};
  var lo=Math.max(10,Math.round(r[0]*(1-cut))),hi=Math.max(lo,Math.round(r[1]*(1-cut)));
  return {txt:(lo===hi?lo:lo+"–"+hi)+" min (~"+Math.round(cut*100)+"% shorter than "+txt+")",range:[lo,hi]}}
/* "you reported …", or the carry-over rule that made the day a recovery day */
function poorTxt(rd,capital){return rd.carry?"Carry-over — "+rd.carry.title.toLowerCase()+" ("+rd.carry.read+"; "+rd.carry.until+")":(capital?"You reported ":"you reported ")+rd.poorWhy.join(", ")}
function carryLine(c){return "Carry-over — "+c.title+": "+c.read+" → "+c.change.charAt(0).toLowerCase()+c.change.slice(1)+" ("+c.until+")."}
function getTrainingDecision(d){
  var s=getScheduledSession(d),sc=getSleepContext(d),rd=getAdaptiveReadiness(d),r=S.days[iso(d)]||{};
  /* carry-over rules from the last few days can only make today more cautious */
  var co=carryCap(d,"train");if(co&&co.v==="red"&&!rd.poor)rd=Object.assign({},rd,{poor:true,poorWhy:[],carry:co.rule});
  var o={sched:s,sleep:sc,ready:rd,status:"none",kind:s.kind,title:s.title,detail:s.note,reasons:[],changed:false,level:0,letter:s.letter,noLoad:false,pending:false,id:null,carry:co?co.rule:null};

var SIDX=null;
function buildIndex(){
  var idx=[],tmp=document.createElement("div");
  refSections().forEach(function(s){if(s.id==="changelog"||s.id==="needs")return;try{tmp.innerHTML=s.h()}catch(err){tmp.innerHTML=""}idx.push({k:"ref",id:s.id,t:s.t,g:s.g,x:tmp.textContent.replace(/\s+/g," ")})});
  Object.keys(EX).forEach(function(k){var e=EX[k];idx.push({k:"ex",id:k,t:e.name,g:e.cat+" · demo",x:[e.purpose,e.start,e.move.join(" "),e.mistakes.join(" "),e.feel,e.notfeel,typeof e.dose==="string"?e.dose:""].join(" ")})});
  NEEDS_SEED.forEach(function(n){idx.push({k:"ref",id:"needs",t:"Needs Review — "+n.sec,g:"Governance",x:n.a+" "+n.b+" "+n.now})});
  MODS.forEach(function(m){idx.push({k:"mod",id:m[0],t:m[1],g:"Protocols",x:m[2]})});
  return idx;
}
function runSearch(q,box){
  q=(q||"").trim().toLowerCase();if(q.length<2){box.innerHTML="";return}
  if(!SIDX)SIDX=buildIndex();
  var terms=q.split(/\s+/),res=[];
  SIDX.forEach(function(e){var hay=(e.t+" "+e.x).toLowerCase(),ok=terms.every(function(t){return hay.indexOf(t)>-1});if(!ok)return;
    var score=(e.t.toLowerCase().indexOf(terms[0])>-1?10:0)+(e.k==="ex"?2:0),i=e.x.toLowerCase().indexOf(terms[0]),snip=i>-1?e.x.slice(Math.max(0,i-50),i+110):e.x.slice(0,140);
    res.push({e:e,s:score,snip:snip})});
  res.sort(function(a,b){return b.s-a.s});
  var re=new RegExp("("+terms.map(function(t){return t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}).join("|")+")","ig");
  box.innerHTML=res.length?'<div class="card open" style="padding:2px 12px;margin-top:10px">'+res.slice(0,30).map(function(r,i){return '<div class="sres" data-si="'+i+'"><div class="t">'+esc(r.e.t).replace(re,"<mark>$1</mark>")+' <span class="tag src">'+r.e.g+'</span></div><div class="x">…'+esc(r.snip).replace(re,"<mark>$1</mark>")+'…</div></div>'}).join("")+'</div>':'<div class="note plain small" style="margin-top:10px">No matches.</div>';
  box.querySelectorAll("[data-si]").forEach(function(el){el.onclick=function(){var r=res[+el.dataset.si].e;closeSheet();
    if(r.k==="ex")openExercise(r.id);else if(r.k==="mod")go("protocols",{mod:r.id});else go("ref",{sec:r.id})}});
}

function bpRoutine(){var bs=S.settings.breath;return ROUTINES.filter(function(r){return r.id===bs.routine})[0]||ROUTINES[0]}
function bpPattern(){var r=bpRoutine();return r.id==="custom"?S.settings.breath.custom.map(Number):r.p}
function buildTimeline(){
  var r=bpRoutine(),p=bpPattern(),bs=S.settings.breath,ph=[],t=0,pre=0;
  function add(k,d,label,voice,from,to){if(d<=0)return;ph.push({k:k,s:t,d:d,label:label,voice:voice,from:from,to:to});t+=d}
  if(r.sigh){var n=Math.max(1,Math.min(3,+bs.sighReps||2));
    for(var i=0;i<n;i++){add("in",2,"BREATHE IN","In",.55,.98);add("top",1,"TOP UP","Top up",.98,1.08);add("out",7,"LONG EXHALE","Out",1.08,.55)}
    add("rest",2,"EASE IN","Now slow and easy",.55,.55);pre=t}
  var cyc=p[0]+p[1]+p[2]+p[3],main=Math.max(1,Math.round(bs.minutes*60/cyc));
  for(var c=0;c<main;c++){add("in",p[0],"BREATHE IN","In",.55,1);add("hold",p[1],"HOLD","Hold",1,1);add("out",p[2],"BREATHE OUT","Out",1,.55);add("rest",p[3],"HOLD","Relax",.55,.55)}
  return {ph:ph,total:t,pre:pre,main:t-pre,cyc:cyc};
}

/* =====================================================================
   AI TOOLS — what the AI can ask the app. Every number is computed here, on this phone, from your saved
   data; the model only explains the results. Tools read; none of them write.
   5.1: every logged field is visible (vestibular sessions, notes), missing data says "not recorded" instead of a
   default, filter values are checked, comparisons use the same matched evidence rules as Trends, periods are split

   ===================================================================== */

var AI_TAGS={"Logged":"lg","Trend":"tr","Protocol":"pr","Reasoning":"rs","Needs Review":"nr"};
function mdInline(s){return s.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<i>$2</i>").replace(/_\(([^)]+)\)_/g,"<i>($1)</i>").replace(/`([^`]+)`/g,"<code>$1</code>")
  .replace(/\[(Logged|Trend|Protocol|Reasoning|Needs Review)\]/g,function(m,t){return '<span class="aitag '+AI_TAGS[t]+'">'+t+'</span>'})}
function mdHTML(src){var L=esc(src||"").split(/\n/),h="",list=null;
  function close(){if(list){h+="</"+list+">";list=null}}
  L.forEach(function(line){var t=line.trim(),m;
    if(!t){close();return}
    if((m=/^#{1,4}\s+(.*)$/.exec(t))){close();h+='<p class="h">'+mdInline(m[1])+'</p>';return}
    if((m=/^[-*•]\s+(.*)$/.exec(t))){if(list!=="ul"){close();h+="<ul>";list="ul"}h+="<li>"+mdInline(m[1])+"</li>";return}
    if((m=/^\d+[.)]\s+(.*)$/.exec(t))){if(list!=="ol"){close();h+="<ol>";list="ol"}h+="<li>"+mdInline(m[1])+"</li>";return}
    close();h+="<p>"+mdInline(t)+"</p>"});
  close();return h}

 ["What you're setting up","A tiny private relay. Your phone sends a question to it; it adds your secret AI key and forwards it to Anthropic (Claude); the answer comes back to the app. Free tier is plenty. Everything is done in Safari on your iPhone — no computer."],
 ["1 · Get an Anthropic API key","Open console.anthropic.com and sign up (this is separate from a Claude.ai subscription). Add a few dollars of credit under Billing, and set a monthly spend limit there (e.g. $10). Then API keys → Create key. Copy it — it starts with sk-ant-. Keep it secret."],

  var cls=u.pct>=90?"r":u.pct>=70?"a":"g",nc=convList().length;
  var h='<div class="meter"><div class="mt"><b>Storage used: '+u.pct+'%</b><span>'+fmtK(u.total)+' of ~'+fmtK(STORE_BUDGET)+' characters</span></div><div class="mb"><i class="'+cls+'" style="width:'+Math.min(100,Math.max(1,u.pct))+'%"></i></div>';
  h+='<div class="tiny muted">Your logs '+fmtK(u.state)+' · AI conversations '+fmtK(u.chats)+' ('+nc+')'+(u.undo?' · undo copy '+fmtK(u.undo):'')+(u.unreadable?' · unreadable data '+fmtK(u.unreadable):'')+(u.other?' · other apps on this site '+fmtK(u.other):'')+'</div>';
  if(u.pct>=70)h+='<div class="note small" style="margin-top:6px"><b>Getting full.</b> Export a backup, then free space: '+(nc>CHAT_KEEP?'older AI conversations (below)':'')+(u.undo?(nc>CHAT_KEEP?', ':'')+'the undo copy':'')+(u.other?((nc>CHAT_KEEP||u.undo)?', ':'')+'old copies of your other apps on this site':'')+'. When it\'s full, new entries can\'t be saved.</div>';
  if(nc>CHAT_KEEP)h+='<button class="btn ghost block" id="bkChats">Export and remove '+(nc-CHAT_KEEP)+' older AI conversation'+(nc-CHAT_KEEP>1?'s':'')+' (keeps the latest '+CHAT_KEEP+')</button>';
  return h+'</div>'}
function trimChats(){var L=convList(),old=L.slice(CHAT_KEEP);if(!old.length)return;
  var o={};old.forEach(function(c){o[c.id]=c});
  var ok=downloadFile("kyle-master-protocol-ai-conversations-"+iso(new Date())+".json",JSON.stringify({app:"kyle-master-protocol",kind:"ai-conversations",exported:new Date().toISOString(),chats:{v:1,convs:o}},null,1));
  if(!ok){toast("Export failed — nothing removed");return}
  if(!confirm("Exported "+old.length+" conversation"+(old.length>1?"s":"")+". Remove them from this phone now? (Importing that file as a backup isn't needed — keep it as an archive.)"))return;
  var c=chatsLoad();old.forEach(function(x){delete c.convs[x.id]});if(c.current&&!c.convs[c.current])c.current=null;chatsSave();toast("Removed "+old.length+" older conversations");renderSettings()}
/* shown on Today when storage is getting full */
function storageWarnHTML(){var u=storageUse();if(!u.ok||u.pct<70)return "";
  return '<div class="note '+(u.pct>=90?"red":"")+' small" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span style="flex:1;min-width:0"><b>Storage '+u.pct+'% full.</b> When it fills, new entries can\'t be saved. Export a backup and free space.</span><button class="btn sm" onclick="go(\'settings\')">Open</button></div>'}
function fallbackCopy(txt){openSheet("Backup text",'<p class="small muted">Select all and copy, then paste it somewhere safe:</p><textarea class="inp" rows="10" id="bkTxt">'+esc(txt)+'</textarea><button class="btn block" id="bkCopied">I saved it</button>',function(){var t=$("bkTxt");t.focus();t.select();$("bkCopied").onclick=function(){markBackup("copied manually");closeSheet();renderSettings()}})}
/* conversations travel in the backup; the AI connection (address + access code) never does */
function backupText(){var o={app:"kyle-master-protocol",version:APP_VERSION,exported:new Date().toISOString(),state:S},c=chatsForBackup();if(c)o.chats=c;return JSON.stringify(o,null,1)}
/* Import is checked before anything changes: it must be this app's data, in a shape this version can read, not from
   a newer version. The data it replaces is kept as an undo copy on this phone (or you're asked to export it first). */
function checkBackup(txt){
  var o=null;try{o=JSON.parse(txt)}catch(e){return {err:"That isn't valid backup text — it may be cut off. Copy or export it again."}}
  if(isPlainObj(o)&&o.app&&o.app!=="kyle-master-protocol")return {err:"That file is from a different app ("+String(o.app).slice(0,40)+")."};
  var st=isPlainObj(o)&&o.state?o.state:o,p=stateProblem(st);
  if(p==="empty"||p)return {err:"Not a Master Protocol backup — "+(p==="empty"?"it has no data":p)+"."};
  if(!isPlainObj(st.settings))return {err:"Not a Master Protocol backup — it has no settings."};
  if(st.rev&&+st.rev>DATA_REV)return {err:"This backup was made by a newer version of the app (data revision "+st.rev+"; this copy reads up to "+DATA_REV+"). Open the app online once to update, then import again."};
  var ks=Object.keys(st.days).filter(function(k){return /^\d{4}-\d{2}-\d{2}$/.test(k)}).sort();
  return {o:o,st:st,days:ks.length,first:ks[0]||null,last:ks[ks.length-1]||null,exported:isPlainObj(o)&&typeof o.exported==="string"?o.exported.slice(0,10):null,version:isPlainObj(o)&&o.version?String(o.version).slice(0,30):null,
    chats:isPlainObj(o)&&isPlainObj(o.chats)&&isPlainObj(o.chats.convs)?Object.keys(o.chats.convs).length:0}}
function keepUndoCopy(){
  try{var payload=JSON.stringify({at:Date.now(),version:APP_VERSION,state:LOAD_FAIL?null:S,unreadable:LOAD_FAIL?LOAD_FAIL.raw:null,chats:chatsForBackup()});localStorage.setItem(SNAP_KEY,payload);return true}catch(e){try{localStorage.removeItem(SNAP_KEY)}catch(e2){}return false}}
function importBackup(txt){
  var c=checkBackup(txt);if(c.err){alert(c.err);return}
  var cur=LOAD_FAIL?"your unreadable saved data":Object.keys(S.days).length+" days on this phone";
  if(!confirm("Replace everything on this phone with this backup?\n\nBackup: "+c.days+" day"+(c.days===1?"":"s")+(c.first?" ("+c.first+" → "+c.last+")":"")+(c.exported?", exported "+c.exported:"")+(c.version?", app "+c.version:"")+(c.chats?", "+c.chats+" AI conversation"+(c.chats>1?"s":""):"")+".\nNow: "+cur+" — kept as an undo copy if there's room."))return;
  if(!keepUndoCopy()){
    if(!confirm("There isn't room to keep an undo copy on this phone. Export your current data first?\n\nOK = export it now, then import · Cancel = stop"))return;
    if(LOAD_FAIL)exportUnreadable();else downloadFile("kyle-master-protocol-before-import-"+iso(new Date())+".json",backupText());
    if(!confirm("Exported. Go ahead and replace everything with the backup?"))return}
  var was=LOAD_FAIL;LOAD_FAIL=null;SET_ASIDE=0;
  try{S=upgrade(sanitizeState(JSON.parse(JSON.stringify(c.st))))}catch(e){LOAD_FAIL=was;alert("The backup couldn't be read by this version: "+(e&&e.message||e)+". Nothing was changed.");return}
  finishMigration();var nc=c.o&&c.o.chats?mergeChats(c.o.chats):0;
  S.changelog.push({id:"c"+Date.now(),d:iso(new Date()),sec:"Backup",old:"—",nw:"Imported backup ("+c.days+" days"+(nc?", "+nc+" AI conversation"+(nc>1?"s":""):"")+(SET_ASIDE?"; "+SET_ASIDE+" item(s) with an unexpected shape kept aside":"")+")",src:"Import",notes:""});
  save();applyTheme();closeSheet();toast("Backup imported"+(SET_ASIDE?" · "+SET_ASIDE+" odd item(s) kept aside":""));go("today");
}
function undoInfo(){try{var v=localStorage.getItem(SNAP_KEY);if(!v)return null;var o=JSON.parse(v);return {at:o.at,size:v.length,o:o}}catch(e){return null}}
function undoImport(){var u=undoInfo();if(!u)return;
  if(!confirm("Put back the data from before the import ("+fmtStamp(u.at)+")? What's on the phone now will be replaced."))return;
  if(u.o.unreadable){LOAD_FAIL={raw:u.o.unreadable,why:"it was unreadable before the import",at:Date.now()};try{localStorage.setItem(KEY,u.o.unreadable)}catch(e){}S=defaultState()}
  else{S=upgrade(sanitizeState(u.o.state));save()}
  if(u.o.chats){CH={v:1,convs:u.o.chats.convs||{},current:null};chatsSave()}
  try{localStorage.removeItem(SNAP_KEY)}catch(e){}applyTheme();toast("Import undone");if(LOAD_FAIL)renderRecovery();else go("today")}
/* ---------- recovery: saved data that can't be read is never overwritten ---------- */
function exportUnreadable(){var raw=LOAD_FAIL?LOAD_FAIL.raw:(function(){try{return localStorage.getItem(QKEY)}catch(e){return null}})();if(!raw){toast("Nothing to export");return}
  var ok=downloadFile("kyle-master-protocol-UNREADABLE-"+iso(new Date())+".txt",raw,"text/plain");toast(ok?"Exported — keep this file; it can often be repaired":"Export failed")}
function renderRecovery(){
  if(!LOAD_FAIL){toast("Your data is readable — nothing to recover");return}
  var L=LOAD_FAIL,h='<p class="small"><b>Your saved data is still on this phone</b>, but '+esc(L.why)+'. Nothing has been changed or deleted, and nothing will be saved until you choose below.</p>';
  h+='<p class="small muted">Size: '+fmtK(L.raw.length)+' characters.</p>';
  h+='<div class="exsec"><h4>1 · Keep a copy (do this first)</h4><button class="btn block" id="rcExport">Export the unreadable data (.txt)</button><p class="tiny muted">A damaged file can often be repaired by hand; keep it even if you restore a backup.</p></div>';
  h+='<div class="exsec"><h4>2 · Then choose</h4><button class="btn block" id="rcImport">Restore a backup file</button><button class="btn ghost block" id="rcFresh">Start fresh (keeps the unreadable data aside)</button><button class="btn ghost block" id="rcLater">Decide later — use the app without saving</button></div>';
  openSheet("Saved data couldn't be read",h,function(b){
    $("rcExport").onclick=exportUnreadable;
    $("rcImport").onclick=function(){$("fileIn").value="";$("fileIn").click()};
    $("rcFresh").onclick=function(){
      var kept=false;try{localStorage.setItem(QKEY,L.raw);kept=true}catch(e){}
      if(!kept&&!confirm("There's no room to keep the unreadable data aside on this phone. Starting fresh will replace it. Did you export it (step 1)?\n\nOK = start fresh · Cancel = go back"))return;
      if(kept&&!confirm("Start fresh? The unreadable data stays aside on this phone (Settings → Backup) until you delete it."))return;
      LOAD_FAIL=null;S=defaultState();S.migrated=true;finishMigration();save();saveBanner();closeSheet();applyTheme();toast("Started fresh");go("today")};
    $("rcLater").onclick=closeSheet})}
function unreadableKept(){try{var v=localStorage.getItem(QKEY);return v?v.length:0}catch(e){return 0}}

function swStatus(){var el=$("swStat");if(!el)return;
  if(!("serviceWorker" in navigator)||!/^https?:$/.test(location.protocol)){el.textContent=/^file:$/.test(location.protocol)?"Not available when opened as a local file — host it (GitHub Pages) to enable offline mode.":"Not supported in this browser.";return}
  navigator.serviceWorker.getRegistration().then(function(r){if(!r){el.textContent="Setting up… reopen once while online.";return}
    (window.caches?caches.keys():Promise.resolve([])).then(function(k){var ks=k.filter(function(x){return /^kmp-/.test(x)}),ok=ks.length>0;el.innerHTML=(ok&&navigator.serviceWorker.controller?'<b style="color:var(--green)">Ready</b> — works without internet':(ok?"Cached — fully active after the next open":"Caching…"))+(ok?'<br><span class="tiny muted">App '+esc(APP_VERSION)+' · offline copy '+esc(ks.sort().slice(-1)[0].replace(/^kmp-/,""))+'</span>':'')})}).catch(function(){el.textContent="Unavailable"});
}

/* =====================================================================
   INIT
   ===================================================================== */
/* Anything typed but not yet committed (sleep h/min, number and text fields) is saved when the app
   is backgrounded or closed — iOS doesn't always fire blur/change on the way out. */
function flushInputs(){try{   /* only fields you've typed into since they were drawn — never a stale copy on a hidden page */
  document.querySelectorAll("[data-sleepdate]").forEach(function(box){if(!box._dirty)return;box._dirty=false;var ins=box.querySelectorAll("[data-sl]");if(ins.length<2)return;
    var hv=ins[0].value.trim(),mv=ins[1].value.trim(),date=box.dataset.sleepdate,cur=sleepMinOf((S.days[date]||{}).track);
    var nv=(hv===""&&mv==="")?null:(Math.max(0,Math.min(16,parseInt(hv,10)||0))*60+Math.max(0,Math.min(59,parseInt(mv,10)||0)));
    if(nv!==cur)setSleepMin(date,nv)});
  document.querySelectorAll("input[data-tk],textarea[data-tk]").forEach(function(inp){if(!inp._dirty)return;inp._dirty=false;var r=S.days[inp.dataset.date]||{},cur=getTV(r,inp.dataset.tk),v=inp.value.trim();
    if(String(cur==null?"":cur)!==v)setTrack(inp.dataset.date,inp.dataset.tk,v)});
}catch(e){}}
/* the last line of defence: if a screen can't be drawn, show a way to get the data out instead of a blank app */
function renderFatal(e){
  var el=$("pg-today");document.querySelectorAll(".page").forEach(function(x){x.classList.toggle("on",x.id==="pg-today")});
  el.innerHTML='<div class="note red small" style="margin-top:14px"><b>Something in the app failed to load</b> ('+esc(String(e&&e.message||e))+'). Your saved data hasn\'t been changed.</div>'+
    '<button class="btn block" onclick="emergencyExport()">Export a backup now</button><button class="btn ghost block" onclick="location.reload()">Reload</button>'+
    '<button class="btn ghost block" onclick="$(\'fileIn\').value=\'\';$(\'fileIn\').click()">Restore a backup file</button>'+
    '<p class="tiny muted">If this keeps happening, export a backup and send it with the message above.</p>'}
/* a new version arrived while the app was open */
function updateReady(){var el=$("updBanner");if(!el)return;el.className="updbar on";el.innerHTML='<span>A new version of the app is ready.</span><button class="btn sm" onclick="flushInputs();location.reload()">Reload</button>'}
(function init(){
  /* wiring first, so even a recovery screen has working buttons */
  try{
    applyTheme();
    document.querySelectorAll(".nav button").forEach(function(b){b.onclick=function(){if(b.dataset.p==="protocols"&&CUR==="protocols"){renderProtocols();window.scrollTo(0,0);return}go(b.dataset.p)}});
    $("btnSearch").onclick=openSearch;$("btnBreath").onclick=function(){openBreath()};
    $("shClose").onclick=closeSheet;$("scrim").onclick=closeSheet;$("bpClose").onclick=closeBreath;
    $("fileIn").onchange=function(){var f=this.files&&this.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){importBackup(String(rd.result))};rd.readAsText(f)};
    document.addEventListener("keydown",function(e){if(e.key==="Escape"){if($("bp").classList.contains("on"))closeBreath();else closeSheet()}});
    window.addEventListener("pagehide",function(){flushInputs();if(BP.st==="run")bpPause("bg")});
    document.addEventListener("visibilitychange",function(){if(document.hidden)flushInputs()});
    /* ask the browser to keep this app's saved data out of automatic storage cleanup (best effort) */
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){})}catch(e){}
    if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
      var hadController=!!navigator.serviceWorker.controller;
      /* a worker taking over a page it didn't load = a new version was installed while the app was open */
      navigator.serviceWorker.addEventListener("controllerchange",function(){if(hadController)updateReady();hadController=true});
      window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js",{scope:"./"}).then(function(r){if(r&&r.update)r.update().catch(function(){})}).catch(function(){})});
    }
    try{matchMedia("(prefers-color-scheme: light)").addEventListener("change",function(){if(S.settings.theme==="auto")applyTheme()})}catch(e){}
  }catch(e){renderFatal(e);return}
  if(LOAD_FAIL){try{go("today")}catch(e){}saveBanner();renderRecovery();return}
  try{
    markActiveDay();
    if(!S.migrated){var f=findSiblingData();if(f.pppd||f.mp)importSiblings(false);else{S.migrated=true;save()}}
    if(!S.settings.programStart){S.settings.programStart=iso(new Date());save()}
    finishMigration();if(!S.meta.pmDoneFrom){S.meta.pmDoneFrom=iso(protoToday());save()}freezePastDays();
    (function(){var u=undoInfo();if(u&&Date.now()-u.at>14*86400000){try{localStorage.removeItem(SNAP_KEY)}catch(e){}}})();
    var lastDay=iso(protoToday());
    function tick(){var k=iso(protoToday());if(k!==lastDay){lastDay=k;freezePastDays();if(CUR==="today")renderToday();updateTop();SIDX=null}}
    setInterval(tick,60000);
    document.addEventListener("visibilitychange",function(){if(document.hidden){if(BP.st==="run")bpPause("bg")}else{markActiveDay();tick();
      if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration)navigator.serviceWorker.getRegistration().then(function(r){if(r&&r.update)r.update().catch(function(){})}).catch(function(){})}});
    go("today");saveBanner();
  }catch(e){renderFatal(e)}
})();
