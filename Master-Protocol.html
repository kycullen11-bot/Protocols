  h+='<div class="field"><label>Vestibular week</label><div class="weeknav" style="margin:0"><button class="iconbtn" onclick="setWeek(-1)">‹</button><div class="wl">Week '+st.vestWeek+'<span>'+VWEEKS[st.vestWeek].tag+'</span></div><button class="iconbtn" onclick="setWeek(1)">›</button></div></div>';
  h+='<div class="row2"><div class="field"><label>Rotation anchor (position 1)</label><input class="inp" type="date" id="stAnchor" value="'+st.anchor+'"></div><div class="field"><label>Strength / Zone 2 start</label><input class="inp" type="date" id="stStart" value="'+(st.programStart||"")+'"></div></div>';
  h+='<p class="tiny muted" style="margin-top:-4px">Anchor: Mon 24 Aug 2026 = the two day shifts that open the 28-day pattern. Programme start drives the strength set scheme and Zone 2 band (currently week '+week()+').</p>';
  h+='</div>';
  h+='<h2 class="sec">Breathwork defaults</h2><div class="card open" style="padding:4px 12px">';
  h+='<div class="rows tight"><div class="r"><span class="k">Routine</span><span class="v">'+bpRoutine().name+' · '+st.breath.minutes+' min</span></div><div class="r"><span class="k">Voice</span><span class="v">'+(st.breath.voice?"On":"Off")+' · '+Math.round(st.breath.voiceVol*100)+'%</span></div><div class="r"><span class="k">Sound</span><span class="v">'+(st.breath.music?"On":"Off")+' · '+soundLabel(st.breath.style)+' · '+Math.round(st.breath.musicVol*100)+'%</span></div></div>';
  h+='<button class="btn ghost block" onclick="openBreath()">Change in the player</button></div>';
  h+='<h2 class="sec">Backup</h2><div class="card open" style="padding:10px 12px">';
  h+='<div class="note '+(STORAGE_OK?"plain":"red")+' small">'+(STORAGE_OK?"Everything you tap is saved on this iPhone (browser storage for this page). Deleting Safari website data or the Home Screen app erases it — export a backup regularly.":"<b>Browser storage is unavailable</b> (private mode or blocked). Data lives only until you close the page — export now.")+'</div>';
  h+='<div class="rows tight" style="margin-bottom:6px"><div class="r"><span class="k">Last successful backup</span><span class="v" id="bkLast"><b>'+fmtStamp(S.meta.lastBackup)+'</b>'+(S.meta.lastBackupMethod?' · '+esc(S.meta.lastBackupMethod):'')+'<br><span class="muted small">'+activeDaysSince(S.meta.lastBackup)+' day'+(activeDaysSince(S.meta.lastBackup)===1?'':'s')+' of use since</span></span></div></div>';
  h+='<button class="btn block" id="bkDl">Export backup (.json file)</button>';
  h+='<button class="btn ghost block" id="bkShare">Share backup (Files, AirDrop, Mail…)</button>';
  h+='<button class="btn ghost block" id="bkCopy">Copy backup text</button>';
  h+='<button class="btn ghost block" id="bkImp">Import backup file</button>';
  h+='<details class="acc"><summary><span class="s">Import by pasting text</span>'+chevSVG()+'</summary><div class="in"><textarea class="inp" id="bkPaste" rows="4" placeholder="Paste backup JSON here"></textarea><button class="btn block" id="bkPasteGo">Import pasted backup</button></div></details>';
  if(f.pppd||f.mp)h+='<div class="note blue small"><b>Found data from your other apps on this site:</b> '+[f.pppd?"PPPD Rehab app":"",f.mp?"My Protocol":""].filter(Boolean).join(" + ")+'.<br><button class="btn sm" id="bkSib" style="margin-top:6px">Import it (read-only, merges)</button></div>';
  h+='</div>';
  h+='<h2 class="sec">Reset</h2><div class="card open" style="padding:10px 12px"><button class="btn ghost block" id="rsToday">Reset today\'s checklist</button><button class="btn red block" id="rsAll">Reset ALL data</button><p class="tiny muted">Reset today clears only today\'s checkboxes. Reset all erases every day, log, setting and edit on this device (export first).</p></div>';
  h+='<h2 class="sec">Offline & install</h2><div class="card open" style="padding:4px 12px">'+rowsHTML([["Offline",'<span id="swStat">Checking…</span>'],["1","Open the app's web address in Safari once while online (GitHub Pages, e.g. …/Protocols/master/)."],["2","Share → Add to Home Screen. After that first load it works with no internet; only the optional “Watch video” links need a connection."],["3","The Home Screen app keeps its own saved data. When switching from an older copy, Export a backup there and Import it here."],["4","Breathwork: tap START each time — iPhone blocks sound until you tap."]])+'</div>';
  h+='<p class="tiny muted" style="text-align:center;margin-top:16px">Kyle Health &amp; Recovery Master Protocol · v'+APP_VERSION+'<br>Not medical advice. Every medication, hormone, peptide, sodium-loading and heat decision goes through your clinicians.</p>';
  $("pg-settings").innerHTML=h;
  function segWire(id,key,num,after){$(id).querySelectorAll("button").forEach(function(b){b.onclick=function(){S.settings[key]=num?+b.dataset.v:b.dataset.v;save();if(after)after();renderSettings()}})}
  swStatus();
  segWire("stTheme","theme",false,applyTheme);segWire("stText","text",false,applyTheme);segWire("stDemo","demoSpeed",true);
  $("stRoll").onclick=function(){st.rollover=!st.rollover;save();renderSettings();updateTop()};
  $("stPhoto").onclick=function(){if(!st.photoScreen&&!confirm("Confirm: you've been screened for photosensitivity/seizure risk and your clinician knows you're doing graded emergency-light exposure?"))return;st.photoScreen=!st.photoScreen;
    S.changelog.push({id:"c"+Date.now(),d:iso(new Date()),sec:"Emergency-light gate",old:st.photoScreen?"Locked":"Unlocked",nw:st.photoScreen?"Unlocked — screen confirmed":"Locked",src:"Settings",notes:""});save();renderSettings()};
  $("stAnchor").onchange=function(){if(this.value){st.anchor=this.value;save();toast("Rotation anchor updated");updateTop()}};
  $("stStart").onchange=function(){if(this.value){st.programStart=this.value;save();toast("Programme start updated")}};
  $("bkDl").onclick=function(){var ok=downloadFile("kyle-master-protocol-backup-"+iso(new Date())+".json",backupText());if(ok)markBackup("file export");toast(ok?"Backup exported":"Export failed — use Copy");if(ok)renderSettings()};
  $("bkShare").onclick=function(){var txt=backupText(),name="kyle-master-protocol-backup-"+iso(new Date())+".json";
    function ok(){markBackup("shared");toast("Backup shared");renderSettings()}
    try{var file=new File([txt],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:"Master Protocol backup"}).then(ok).catch(function(){});return}}catch(e){}
    if(navigator.share){navigator.share({title:"Master Protocol backup",text:txt}).then(ok).catch(function(){})}else toast("Sharing not supported — use Export or Copy")};
  $("bkCopy").onclick=function(){var txt=backupText();if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){markBackup("copied");toast("Backup copied — paste it somewhere safe");renderSettings()},function(){fallbackCopy(txt)});else fallbackCopy(txt)};
  $("bkImp").onclick=function(){$("fileIn").value="";$("fileIn").click()};
  $("bkPasteGo").onclick=function(){importBackup($("bkPaste").value)};
  if($("bkSib"))$("bkSib").onclick=function(){var m=importSiblings(true);toast(m.length?"Imported: "+m.length+" source(s)":"Nothing to import");renderSettings()};
  $("rsToday").onclick=function(){if(!confirm("Clear today's checkboxes? Logs and history stay."))return;var r=rec(protoToday());var k=iso(protoToday());
    if(r.checks&&r.checks["s.workout"])setStrengthCompleted(protoToday(),false);delete r.trainLock;r.checks={};save();toast("Today reset")};
  $("rsAll").onclick=function(){var a=prompt("This erases ALL data on this device. Type RESET to confirm.");if(a!=="RESET"){toast("Not reset");return}
    try{localStorage.removeItem(KEY)}catch(e){}MEM_FALLBACK=null;S=defaultState();S.migrated=true;save();applyTheme();toast("All data reset");go("today")};
}
function fallbackCopy(txt){openSheet("Backup text",'<p class="small muted">Select all and copy, then paste it somewhere safe:</p><textarea class="inp" rows="10" id="bkTxt">'+esc(txt)+'</textarea><button class="btn block" id="bkCopied">I saved it</button>',function(){var t=$("bkTxt");t.focus();t.select();$("bkCopied").onclick=function(){markBackup("copied manually");closeSheet();renderSettings()}})}
function backupText(){return JSON.stringify({app:"kyle-master-protocol",version:APP_VERSION,exported:new Date().toISOString(),state:S},null,1)}
function importBackup(txt){
  var o=null;try{o=JSON.parse(txt)}catch(e){toast("That isn't valid backup text");return}
  var st=o&&o.state?o.state:o;if(!st||typeof st!=="object"||!st.days||!st.settings){toast("Not a Master Protocol backup");return}
  var nd=Object.keys(st.days).length;if(!confirm("Replace everything on this device with this backup ("+nd+" days of data"+(o.exported?", exported "+o.exported.slice(0,10):"")+")?"))return;
  S=upgrade(st);S.changelog.push({id:"c"+Date.now(),d:iso(new Date()),sec:"Backup",old:"—",nw:"Imported backup ("+nd+" days)",src:"Import",notes:""});save();applyTheme();toast("Backup imported");go("today");
}

function swStatus(){var el=$("swStat");if(!el)return;
  if(!("serviceWorker" in navigator)||!/^https?:$/.test(location.protocol)){el.textContent=/^file:$/.test(location.protocol)?"Not available when opened as a local file — host it (GitHub Pages) to enable offline mode.":"Not supported in this browser.";return}
  navigator.serviceWorker.getRegistration().then(function(r){if(!r){el.textContent="Setting up… reopen once while online.";return}
    (window.caches?caches.keys():Promise.resolve([])).then(function(k){var ok=k.some(function(x){return /^kmp-/.test(x)});el.innerHTML=ok&&navigator.serviceWorker.controller?'<b style="color:var(--green)">Ready</b> — works without internet':(ok?"Cached — fully active after the next open":"Caching…")})}).catch(function(){el.textContent="Unavailable"});
}

/* Anything typed but not yet committed (sleep h/min, number and text fields) is saved when the app
   is backgrounded or closed — iOS doesn't always fire blur/change on the way out. */
function flushInputs(){try{   /* only fields you've typed into since they were drawn — never a stale copy on a hidden page */
  document.querySelectorAll("[data-sleepdate]").forEach(function(box){if(!box._dirty)return;box._dirty=false;var ins=box.querySelectorAll("[data-sl]");if(ins.length<2)return;
    var hv=ins[0].value.trim(),mv=ins[1].value.trim(),date=box.dataset.sleepdate,cur=sleepMinOf((S.days[date]||{}).track);
    var nv=(hv===""&&mv==="")?null:(Math.max(0,Math.min(16,parseInt(hv,10)||0))*60+Math.max(0,Math.min(59,parseInt(mv,10)||0)));
    if(nv!==cur)setSleepMin(date,nv)});
  document.querySelectorAll("input[data-tk],textarea[data-tk]").forEach(function(inp){if(!inp._dirty)return;inp._dirty=false;var r=S.days[inp.dataset.date]||{},cur=getTV(r,inp.dataset.tk),v=inp.value.trim();
    if(String(cur==null?"":cur)!==v)setTrack(inp.dataset.date,inp.dataset.tk,v)});
}catch(e){}}
(function init(){
  applyTheme();markActiveDay();
  if(!S.migrated){var f=findSiblingData();if(f.pppd||f.mp)importSiblings(false);else{S.migrated=true;save()}}
  if(!S.settings.programStart){S.settings.programStart=iso(new Date());save()}
  document.querySelectorAll(".nav button").forEach(function(b){b.onclick=function(){if(b.dataset.p==="protocols"&&CUR==="protocols"){renderProtocols();window.scrollTo(0,0);return}go(b.dataset.p)}});
  $("btnSearch").onclick=openSearch;$("btnBreath").onclick=function(){openBreath()};
  $("shClose").onclick=closeSheet;$("scrim").onclick=closeSheet;$("bpClose").onclick=closeBreath;
  $("fileIn").onchange=function(){var f=this.files&&this.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){importBackup(String(rd.result))};rd.readAsText(f)};
  document.addEventListener("keydown",function(e){if(e.key==="Escape"){if($("bp").classList.contains("on"))closeBreath();else closeSheet()}});
  var lastDay=iso(protoToday());
  function tick(){var k=iso(protoToday());if(k!==lastDay){lastDay=k;if(CUR==="today")renderToday();updateTop();SIDX=null}}
  setInterval(tick,60000);
  document.addEventListener("visibilitychange",function(){if(document.hidden){if(BP.st==="run")bpPause("bg")}else{markActiveDay();tick()}});
  window.addEventListener("pagehide",function(){flushInputs();if(BP.st==="run")bpPause("bg")});
  document.addEventListener("visibilitychange",function(){if(document.hidden)flushInputs()});
  /* ask the browser to keep this app's saved data out of automatic storage cleanup (best effort) */
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){})}catch(e){}
  if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
    window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js",{scope:"./"}).then(function(r){if(r&&r.update)r.update().catch(function(){})}).catch(function(){})});
  }
  try{matchMedia("(prefers-color-scheme: light)").addEventListener("change",function(){if(S.settings.theme==="auto")applyTheme()})}catch(e){}
  go("today");
})();
